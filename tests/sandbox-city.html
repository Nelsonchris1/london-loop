<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>London Loop — city sandbox</title>
  <link rel="icon" href="data:," />
  <script type="importmap">
    {
      "imports": {
        "three": "../vendor/three/build/three.webgpu.js",
        "three/webgpu": "../vendor/three/build/three.webgpu.js",
        "three/tsl": "../vendor/three/build/three.tsl.js",
        "three/addons/": "../vendor/three/examples/jsm/"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 12px/1.4 system-ui, sans-serif; }
    #hud { position: fixed; left: 8px; top: 8px; color: #fff; background: rgba(0,0,0,.5); padding: 6px 9px; border-radius: 6px; white-space: pre; pointer-events: none; max-width: 60vw; }
    #pick { position: fixed; right: 8px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; max-width: 55vw; justify-content: flex-end; }
    #pick a { color: #fff; background: rgba(0,0,0,.45); padding: 3px 7px; border-radius: 5px; text-decoration: none; }
    #pick a.on { background: #c8102e; }
  </style>
</head>
<body>
  <div id="hud">loading…</div>
  <div id="pick"></div>
  <script type="module">
    // ?cx=&cz=&r=   build only the square of half-size r around (cx, cz) (default Westminster 300,750,450; r>=6000: all)
    // ?time=golden|midday|twilight|night   ?cam=aerial|street|heli   ?az=deg ?el=deg ?d=m (orbit)   ?at=x,z (look-at)
    // ?fov=  ?h= (street eye height)  ?nodetails ?notrees ?shadows ?webgl
    // ?post (London colour grade + bloom, as in the game)  ?landmarks  ?weather=clear|overcast|drizzle|fog
    // ?pos=x,y,z&look=x,y,z (exact camera, e.g. the scenic cams of js/cameras.js: westminster pos=505,11,800 look=236,55,790)
    import * as THREE from 'three/webgpu';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GEO } from '../js/ldn-geodata.js';
    import { WORLD } from '../js/london-config.js';
    import { buildLondonCity } from '../js/london-city.js';
    import { cityUniforms } from '../js/tsl-materials.js';
    import { setupSceneCulling, updateSceneCulling } from '../js/scene-culling.js';

    const q = new URLSearchParams(location.search);
    const num = (k, d) => (q.has(k) && q.get(k) !== '' ? Number(q.get(k)) : d);
    const cx = num('cx', 300), cz = num('cz', 750), r = num('r', 450);
    const timeId = { night: 'midnight', midnight: 'midnight', golden: 'golden', midday: 'midday', twilight: 'twilight', blue: 'twilight' }[q.get('time') || 'golden'] || 'golden';
    const camMode = q.get('cam') || 'aerial';
    const hud = document.getElementById('hud');
    const log = (s) => { hud.textContent = s; };
    if (q.has('nohud')) { hud.style.display = 'none'; document.getElementById('pick').style.display = 'none'; }

    const PLACES = { westminster: [300, 750, 450], whitehall: [60, 380, 400], soho: [-400, -400, 400], city: [2200, -400, 500],
      southbank: [1100, 150, 450], belgravia: [-1300, 1400, 450], kennington: [1200, 2200, 400], hydepark: [-2700, 500, 700], kingscross: [400, -2500, 450] };
    const pick = document.getElementById('pick');
    for (const [k, [x, z, rr]] of Object.entries(PLACES)) {
      const a = document.createElement('a'); const p = new URLSearchParams(location.search);
      p.set('cx', x); p.set('cz', z); p.set('r', rr); a.href = '?' + p; a.textContent = k;
      if (x === cx && z === cz) a.className = 'on'; pick.appendChild(a);
    }
    for (const t of ['golden', 'midday', 'twilight', 'night']) {
      const a = document.createElement('a'); const p = new URLSearchParams(location.search); p.set('time', t); a.href = '?' + p; a.textContent = t; pick.appendChild(a);
    }
    for (const c of ['aerial', 'street', 'heli']) {
      const a = document.createElement('a'); const p = new URLSearchParams(location.search); p.set('cam', c); a.href = '?' + p; a.textContent = c; pick.appendChild(a);
    }

    const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: q.has('webgl'), reversedDepthBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = q.has('shadows');
    document.body.appendChild(renderer.domElement);
    await renderer.init();

    const scene = new THREE.Scene();
    let lighting = null;
    try {
      const { LightingSystem } = await import('../js/lighting.js');
      lighting = new LightingSystem(scene, renderer);
      lighting.applyPreset(timeId, true);
      if (q.get('weather')) lighting.setWeather(q.get('weather'));
    } catch (e) {
      console.warn('LightingSystem failed, simple sky fallback:', e);
      const night = timeId === 'midnight';
      scene.background = new THREE.Color(night ? 0x0b1528 : 0x9fbcd8);
      scene.fog = new THREE.Fog(scene.background, 800, 6000);
      const sun = new THREE.DirectionalLight(night ? 0x8090c0 : 0xffd0a0, night ? 0.3 : 3);
      sun.position.set(-0.5, 0.6, -0.6);
      scene.add(sun, new THREE.HemisphereLight(0x9abbe6, 0x8a7060, night ? 0.4 : 1.2));
      cityUniforms.uInteriorGlow.value = night ? 1.55 : 0.4;
    }

    const region = r >= 6000 ? null : { cx, cz, r };
    const t0 = performance.now();
    const city = buildLondonCity(scene, { geo: GEO, world: WORLD, region, details: !q.has('nodetails'), trees: !q.has('notrees') });
    const tBuild = performance.now() - t0;
    let landmarks = null;
    if (q.has('landmarks')) {
      const { buildLondonLandmarks } = await import('../js/london-landmarks.js');
      landmarks = buildLondonLandmarks(scene, { world: WORLD, uniforms: cityUniforms });
    }
    if (lighting) setupSceneCulling(scene, [...Object.values(city.groups), ...(landmarks ? landmarks.group.children : [])], lighting.sunLight.shadow);
    window.city = city; window.scene = scene;

    const camera = new THREE.PerspectiveCamera(num('fov', camMode === 'street' ? 62 : 50), innerWidth / innerHeight, 0.3, 40000);
    const controls = new OrbitControls(camera, renderer.domElement);
    let tx = cx, tz = cz;
    if (q.has('at')) [tx, tz] = q.get('at').split(',').map(Number);
    if (q.has('pos')) {
      const [px, py, pz] = q.get('pos').split(',').map(Number);
      const [lx, ly, lz] = (q.get('look') || `${tx},0,${tz}`).split(',').map(Number);
      camera.position.set(px, py, pz);
      controls.target.set(lx, ly, lz);
    } else if (camMode === 'street') {
      const hit = WORLD.nearestRoad(tx, tz, { kinds: 'major', maxDist: 400 }) || WORLD.nearestRoad(tx, tz, { kinds: 'drive', maxDist: 600 });
      const h = num('h', 1.7);
      let x = tx, z = tz, hd = 0;
      if (hit) { x = hit.x; z = hit.z; hd = hit.heading; }
      if (q.has('hd')) hd = num('hd', 0) * Math.PI / 180;
      const off = hit ? hit.road.w / 2 + 1.2 : 0; // stand on the left pavement
      x += Math.cos(hd) * off; z -= Math.sin(hd) * off;
      const y = city.surfaceHeight(x, z) + h;
      camera.position.set(x, y, z);
      controls.target.set(x + Math.sin(hd) * 40, y + num('look', 4), z + Math.cos(hd) * 40);
    } else {
      const az = num('az', camMode === 'heli' ? 210 : 200) * Math.PI / 180, el = num('el', camMode === 'heli' ? 18 : 38) * Math.PI / 180;
      const d = num('d', camMode === 'heli' ? r * 1.1 : r * 1.25);
      camera.position.set(tx + Math.sin(az) * Math.cos(el) * d, Math.sin(el) * d + 2, tz + Math.cos(az) * Math.cos(el) * d);
      controls.target.set(tx, 0, tz);
    }
    controls.update();

    let pipeline = null;
    if (q.has('post')) {
      const { pass } = await import('three/tsl');
      const { createPostProcessing } = await import('../js/post-processing.js');
      const scenePass = pass(scene, camera);
      const grade = createPostProcessing(renderer, scenePass.getTextureNode('output'), null);
      grade.applyPreset(timeId);
      if (q.get('weather')) grade.applyWeather(q.get('weather'));
      pipeline = new THREE.RenderPipeline(renderer, grade.outputNode);
    }
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    const s = city.stats;
    const info = `London Loop city · ${region ? `cx ${cx} cz ${cz} r ${r}` : 'whole city'} · ${timeId}\n` +
      `build ${Math.round(tBuild)} ms · ${s.buildings} buildings · ${(s.triangles / 1e6).toFixed(2)}M tris · ${s.drawCalls} meshes\n` +
      Object.entries(s.timings).map(([k, v]) => `${k} ${v}`).join(' · ');
    console.log(info.replace(/\n/g, ' | '));
    console.log('stats', JSON.stringify({ road: s.roadStats, details: s.detailStats, buildings: s.buildingStats }));
    let frames = 0, last = performance.now();
    const clock = new THREE.Timer();
    renderer.setAnimationLoop(() => {
      clock.update(); const dt = clock.getDelta();
      controls.update();
      if (lighting) lighting.update(camera.position);
      updateSceneCulling(camera.position);
      city.update(dt, camera);
      if (landmarks) landmarks.update(dt);
      if (pipeline) pipeline.render(); else renderer.render(scene, camera);
      frames++;
      const now = performance.now();
      if (now - last > 1000) {
        log(info + `\n${(frames * 1000 / (now - last)).toFixed(1)} fps · draws ${renderer.info.render.drawCalls} · tris ${(renderer.info.render.triangles / 1e6).toFixed(2)}M · cam ${camera.position.toArray().map((v) => v.toFixed(0))}`);
        frames = 0; last = now;
      }
    });
  </script>
</body>
</html>
