<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>London Loop · traffic sandbox</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fa3b5; font: 12px/1.35 system-ui, Arial, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; left: 10px; top: 8px; color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "../vendor/three/build/three.webgpu.js",
        "three/webgpu": "../vendor/three/build/three.webgpu.js",
        "three/tsl": "../vendor/three/build/three.tsl.js",
        "three/addons/": "../vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">loading…</div>
  <script type="module">
    // tests/sandbox-traffic.html — Workstream G sandbox: the road network + traffic + people on a disc of the real map,
    // flat road ribbons drawn from GEO.roads (no city), aerial camera.
    //   ?cx=&cz=&r=   centre / radius of the area (default Trafalgar Square 0,0 r=500; Hyde Park Corner -1580,430)
    //   ?h=           camera height (default 0.55 r)   ?tilt=  0 top-down … 1 low (default 0.45)   ?yaw= degrees
    //   ?warm=        seconds of simulation before the first frame (default 20)
    //   ?vehicles= ?peds= ?radius=   override the counts / live radius (SwiftShader: keep them small)
    //   ?frames=N    stop after N rendered frames (headless screenshots)
    //   ?night ?rain ?webgl ?noshadow ?signals (show signal head debug lamps) ?bridge=up (Tower Bridge raised)
    import * as THREE from 'three/webgpu';
    import { GEO, WORLD } from '../js/london-config.js';
    import { buildLondonRoadNetwork } from '../js/road-network.js';
    import { createTrafficSystem } from '../js/traffic.js';
    import { buildRoadPaint } from '../js/road-paint.js';
    import { setVehicleNightFromGlow } from '../js/london-vehicles.js';

    const q = new URLSearchParams(location.search);
    const cx = +(q.get('cx') ?? 0), cz = +(q.get('cz') ?? 0), R = +(q.get('r') ?? 500);
    const night = q.has('night');
    const hud = document.getElementById('hud');

    const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: q.has('webgl') });
    renderer.setPixelRatio(1);
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = !q.has('noshadow');
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);
    await renderer.init();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(night ? 0x0b1020 : 0x9fb4c8);
    scene.fog = new THREE.Fog(scene.background, R * 1.2, R * 3);
    scene.add(new THREE.HemisphereLight(night ? 0x334466 : 0xdfe8f2, 0x4a4a40, night ? 0.35 : 1.4));
    const sun = new THREE.DirectionalLight(0xfff1dd, night ? 0.05 : 2.2);
    sun.position.set(cx - 200, 300, cz + 150);
    sun.target.position.set(cx, 0, cz);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -R * 0.6, right: R * 0.6, top: R * 0.6, bottom: -R * 0.6, near: 10, far: 900 });
    scene.add(sun, sun.target);
    setVehicleNightFromGlow(night ? 1.5 : 0.3);

    // ground + flat road ribbons (drive roads dark, pavements light), y from bridge decks
    const ground = new THREE.Mesh(new THREE.CircleGeometry(R * 1.3, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardNodeMaterial({ color: 0x5d6b52, roughness: 1 }));
    ground.position.set(cx, -0.05, cz);
    ground.receiveShadow = true;
    scene.add(ground);
    const DRIVE = new Set(['motorway', 'trunk', 'primary', 'secondary', 'tertiary', 'unclassified', 'residential', 'living_street', 'service']);
    function ribbon(filter, widthOf, y0) {
      const pos = [], idx = [];
      for (const r of GEO.roads) {
        if (!filter(r) || r.tunnel) continue;
        const p = r.pts;
        let near = false;
        for (let i = 0; i < p.length && !near; i += 2) near = Math.hypot(p[i] - cx, p[i + 1] - cz) < R * 1.1;
        if (!near) continue;
        const w = widthOf(r) / 2;
        for (let i = 0; i + 3 < p.length; i += 2) {
          const ax = p[i], az = p[i + 1], bx = p[i + 2], bz = p[i + 3], L = Math.hypot(bx - ax, bz - az) || 1;
          const nx = ((az - bz) / L) * w, nz = ((bx - ax) / L) * w;
          const ya = (r.deck ? r.deck[i / 2] : 0) + y0, yb = (r.deck ? r.deck[i / 2 + 1] : 0) + y0;
          const k = pos.length / 3;
          // extend each quad a little past its ends so bends have no gaps
          const ex = ((bx - ax) / L) * w * 0.5, ez = ((bz - az) / L) * w * 0.5;
          pos.push(ax + nx - ex, ya, az + nz - ez, ax - nx - ex, ya, az - nz - ez, bx - nx + ex, yb, bz - nz + ez, bx + nx + ex, yb, bz + nz + ez);
          idx.push(k, k + 2, k + 1, k, k + 3, k + 2); // wound to face up (+y)
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setIndex(idx);
      const nrm = new Float32Array(pos.length);
      for (let i = 1; i < nrm.length; i += 3) nrm[i] = 1;
      g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
      return g;
    }
    const pave = new THREE.Mesh(ribbon((r) => DRIVE.has(r.kind) && r.kind !== 'service', (r) => r.w + 6, -0.02),
      new THREE.MeshStandardNodeMaterial({ color: 0x9c9a94, roughness: 0.95, side: THREE.DoubleSide }));
    const asphalt = new THREE.Mesh(ribbon((r) => DRIVE.has(r.kind), (r) => r.w, 0.0),
      new THREE.MeshStandardNodeMaterial({ color: 0x34363a, roughness: 0.9, side: THREE.DoubleSide }));
    const foot = new THREE.Mesh(ribbon((r) => r.kind === 'pedestrian' || (r.kind === 'footway' && r.sub !== 'sidewalk'), () => 2.2, -0.03),
      new THREE.MeshStandardNodeMaterial({ color: 0xb3ab98, roughness: 1, side: THREE.DoubleSide }));
    for (const m of [pave, asphalt, foot]) { m.receiveShadow = true; scene.add(m); }
    const water = GEO.water.filter((w) => w.kind === 'river');
    for (const w of water) {
      const sh = new THREE.Shape();
      for (let i = 0; i < w.pts.length; i += 2) (i ? sh.lineTo : sh.moveTo).call(sh, w.pts[i], -w.pts[i + 1]);
      const m = new THREE.Mesh(new THREE.ShapeGeometry(sh).rotateX(-Math.PI / 2), new THREE.MeshStandardNodeMaterial({ color: 0x3c5566, roughness: 0.3 }));
      m.position.y = -0.04;
      scene.add(m);
    }

    const t0 = performance.now();
    const network = buildLondonRoadNetwork(GEO, WORLD);
    const tNet = performance.now() - t0;
    const towerBridge = q.get('bridge') === 'up'
      ? { centre: { x: 3656.5, z: 246.3 }, axis: { x: -0.391, z: 0.92 }, stopLines: [-49.4, 49.4], isPassable: () => false } : null;
    const traffic = createTrafficSystem(scene, { network, geo: GEO, world: WORLD, towerBridge,
      touristAt: q.has('notourists') ? () => 0 : undefined,
      vehicles: q.has('vehicles') ? +q.get('vehicles') : undefined, peds: q.has('peds') ? +q.get('peds') : undefined, radius: q.has('radius') ? +q.get('radius') : undefined });
    const paint = buildRoadPaint(scene, network);
    traffic.setRain(q.has('rain'));

    // debug signal lamps
    let lamps = null;
    if (q.has('signals')) {
      const heads = network.signalHeads.filter((h) => Math.hypot(h.x - cx, h.z - cz) < R);
      lamps = new THREE.InstancedMesh(new THREE.SphereGeometry(0.6, 10, 8), new THREE.MeshBasicNodeMaterial(), heads.length);
      lamps.userData.heads = heads;
      heads.forEach((h, i) => lamps.setMatrixAt(i, new THREE.Matrix4().makeTranslation(h.x, h.y + 3.2, h.z)));
      lamps.setColorAt(0, new THREE.Color());
      scene.add(lamps);
    }
    const ASPECT_COL = [new THREE.Color(3, 0.1, 0.05), new THREE.Color(3, 1.2, 0.05), new THREE.Color(0.1, 3, 0.4), new THREE.Color(3, 1.6, 0.05)];

    // aerial camera
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, R * 6);
    const h = +(q.get('h') ?? R * 0.55), tilt = +(q.get('tilt') ?? 0.45), yaw = (+(q.get('yaw') ?? 0) * Math.PI) / 180;
    camera.position.set(cx + Math.sin(yaw) * h * tilt * 1.4, h, cz + Math.cos(yaw) * h * tilt * 1.4);
    camera.lookAt(cx, 0, cz);
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

    const focus = new THREE.Vector3(cx, 0, cz);
    const warm = +(q.get('warm') ?? 20);
    const tw = performance.now();
    for (let t = 0; t < warm; t += 1 / 15) traffic.update(1 / 15, t, focus, null, 'car', camera);
    const tWarm = performance.now() - tw;

    console.log(`[sandbox-traffic] network ${tNet.toFixed(0)} ms, warm-up ${tWarm.toFixed(0)} ms`, JSON.stringify(traffic.stats()));
    const maxFrames = q.has('frames') ? +q.get('frames') : Infinity;
    let frames = 0;
    let last = performance.now(), elapsed = warm, ms = 0;
    renderer.setAnimationLoop((now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      elapsed += dt;
      const a = performance.now();
      traffic.update(dt, elapsed, focus, null, 'car', camera);
      ms = ms * 0.9 + (performance.now() - a) * 0.1;
      if (lamps) {
        lamps.userData.heads.forEach((hd, i) => lamps.setColorAt(i, ASPECT_COL[traffic.signalAspects[hd.id]] || ASPECT_COL[0]));
        lamps.instanceColor.needsUpdate = true;
      }
      renderer.render(scene, camera);
      const st = traffic.stats();
      hud.textContent = `traffic sandbox  (${cx}, ${cz}) r=${R}\n` +
        `network ${tNet.toFixed(0)} ms · ${network.stats.links} links · ${network.stats.controllers} signal controllers · warm-up ${warm}s in ${tWarm.toFixed(0)} ms\n` +
        `vehicles ${st.vehicles} · peds ${st.peds} (${st.drawnPeds} drawn) · update ${ms.toFixed(2)} ms (sim ${st.stepMs.toFixed(2)})\n` +
        `recycled ${st.recycled} · red runs ${st.redRuns} · paint tiles ${paint.tiles.size}`;
      window.__traffic = { stats: st, ms };
      if (++frames >= maxFrames) { renderer.setAnimationLoop(null); console.log('[sandbox-traffic] stopped after', frames, 'frames', hud.textContent.replace(/\n/g, ' | ')); }
    });
  </script>
</body>
</html>
