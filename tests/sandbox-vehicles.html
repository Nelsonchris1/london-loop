<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>London Loop · vehicles sandbox</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb4c8; font: 12px/1.3 system-ui, Arial, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; left: 10px; top: 8px; color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
    .lbl { position: fixed; transform: translate(-50%, -100%); color: #fff; background: rgba(10, 14, 20, 0.72); padding: 2px 6px;
      border-radius: 4px; font-weight: 600; pointer-events: none; white-space: nowrap; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "../vendor/three/build/three.webgpu.js",
        "three/webgpu": "../vendor/three/build/three.webgpu.js",
        "three/tsl": "../vendor/three/build/three.tsl.js",
        "three/addons/": "../vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud"></div>
  <script type="module">
    // tests/sandbox-vehicles.html — Workstream C sandbox.
    //   ?show=all            lineup of every model (also ?show=blackCab|rideCar|doubleDecker|hireBike|policeHeli|riverBoat|hatch|saloon|suv|van)
    //   ?view=front|rear|side|top|low  ?yaw=deg ?dist=m   camera framing for ?show
    //   ?mode=car|ride|cyclist|helicopter|boat|person|bus   drive with the controller (WASD/arrows, Shift, Space, Q/E)
    //   ?autotest  scripted drives in every mode (console PASS/FAIL, title AUTOTEST PASS|FAIL)
    //   ?drive=slalom|wall|reverse  scripted drive for screenshots / frame capture (window.__sb.trace = per-frame samples)
    //   ?night  lamps & lit windows     ?webgl  WebGL2 backend     ?noshadow
    import * as THREE from 'three/webgpu';
    import { VEHICLE_FACTORIES, VEHICLE_UNIFORMS, setVehicleNightFromGlow } from '../js/london-vehicles.js';
    import { ThirdPersonControllerManager, createFallbackWorld } from '../js/controllers.js';
    import { CameraSystem } from '../js/cameras.js';
    import { cityUniforms } from '../js/tsl-materials.js';

    const q = new URLSearchParams(location.search);
    const night = q.has('night');
    const show = q.get('show');
    const mode = q.get('mode') || (show ? null : 'car');
    const hud = document.getElementById('hud');

    const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: q.has('webgl') });
    renderer.setPixelRatio(1);
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = !q.has('noshadow');
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = night ? 0.9 : 1.0;
    document.body.appendChild(renderer.domElement);
    await renderer.init();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(night ? 0x0b1020 : 0xa9bfd4);
    scene.fog = new THREE.Fog(scene.background, 250, 900);
    // simple gradient sky as the environment (reflections on paint & glass)
    {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 128;
      const g = c.getContext('2d');
      const gr = g.createLinearGradient(0, 0, 0, 128);
      if (night) { gr.addColorStop(0, '#05070d'); gr.addColorStop(0.5, '#1c2233'); gr.addColorStop(1, '#0a0a0a'); }
      else { gr.addColorStop(0, '#5c86b8'); gr.addColorStop(0.48, '#dfe7ee'); gr.addColorStop(0.52, '#8d8a84'); gr.addColorStop(1, '#4a4844'); }
      g.fillStyle = gr; g.fillRect(0, 0, 256, 128);
      const env = new THREE.CanvasTexture(c);
      env.mapping = THREE.EquirectangularReflectionMapping;
      env.colorSpace = THREE.SRGBColorSpace;
      scene.environment = env;
      scene.environmentIntensity = night ? 0.25 : 0.9;
    }
    cityUniforms.uInteriorGlow.value = night ? 1.55 : 0.3;
    setVehicleNightFromGlow(cityUniforms.uInteriorGlow.value);
    const hemi = new THREE.HemisphereLight(0xdfe8ff, 0x4a4036, night ? 0.12 : 1.1);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(night ? 0x8899cc : 0xfff1dd, night ? 0.15 : 2.6);
    sun.position.set(-60, 90, 70);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 300 });
    scene.add(sun, sun.target);
    if (night) {
      for (const [x, z] of [[-20, 10], [20, 10], [0, -20], [-40, 30], [40, 30]]) {
        const l = new THREE.PointLight(0xffc27a, 60, 40, 2);
        l.position.set(x, 6, z);
        scene.add(l);
      }
    }

    // ---- test world: ground, river band (z 60..160), a bridge (|x| < 7) with two piers, a few buildings ----
    const world = createFallbackWorld();
    const W0 = 60, W1 = 160;
    const mat = (color, rough = 0.9) => new THREE.MeshStandardNodeMaterial({ color, roughness: rough });
    const groundMat = mat(0x55585c);
    for (const [z0, z1] of [[-400, W0], [W1, 500]]) {
      const g = new THREE.Mesh(new THREE.PlaneGeometry(900, z1 - z0).rotateX(-Math.PI / 2), groundMat);
      g.position.set(0, 0, (z0 + z1) / 2);
      g.receiveShadow = true;
      scene.add(g);
    }
    // lane markings
    for (let z = -200; z < W0 - 40; z += 6) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 3).rotateX(-Math.PI / 2), mat(0xeeeeee, 0.6));
      m.position.set(0, 0.01, z);
      scene.add(m);
    }
    const water = new THREE.Mesh(new THREE.PlaneGeometry(900, W1 - W0).rotateX(-Math.PI / 2),
      new THREE.MeshStandardNodeMaterial({ color: 0x2f4a55, roughness: 0.12, metalness: 0.2 }));
    water.position.set(0, -1.2, (W0 + W1) / 2);
    water.receiveShadow = true;
    scene.add(water);
    for (const z of [W0, W1]) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(900, 4, 1), mat(0x8a8274));
      wall.position.set(0, -1.6, z + (z === W0 ? -0.5 : 0.5));
      scene.add(wall);
    }
    // bridge deck: ramps + span
    {
      const b = world.bridge;
      const deckMat = mat(0x6a6d70);
      const segs = [[b.waterZ0 - b.ramp, b.waterZ0, 0, b.deckY], [b.waterZ0, b.waterZ1, b.deckY, b.deckY], [b.waterZ1, b.waterZ1 + b.ramp, b.deckY, 0]];
      for (const [z0, z1, y0, y1] of segs) {
        const len = Math.hypot(z1 - z0, y1 - y0);
        const deck = new THREE.Mesh(new THREE.BoxGeometry(b.bridgeHalf * 2, 0.6, len), deckMat);
        deck.position.set(0, (y0 + y1) / 2 - 0.3, (z0 + z1) / 2);
        deck.rotation.x = -Math.atan2(y1 - y0, z1 - z0);
        deck.castShadow = deck.receiveShadow = true;
        scene.add(deck);
      }
      for (const side of [-1, 1]) {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.1, W1 - W0), mat(0x2f3a3f));
        rail.position.set(side * (b.bridgeHalf - 0.15), b.deckY + 0.55, (W0 + W1) / 2);
        scene.add(rail);
      }
    }
    const colliders = [];
    const addBox = (x, z, w, d, h, color = 0xb7a58a, rot = 0, extra = {}) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
      m.position.set(x, (extra.y0 || 0) + h / 2, z);
      m.rotation.y = rot;
      m.castShadow = m.receiveShadow = true;
      scene.add(m);
      const cs = Math.cos(rot), sn = Math.sin(rot);
      const ex = Math.abs(cs) * w / 2 + Math.abs(sn) * d / 2, ez = Math.abs(sn) * w / 2 + Math.abs(cs) * d / 2;
      const c = { minX: x - ex, maxX: x + ex, minZ: z - ez, maxZ: z + ez, maxY: (extra.y0 || 0) + h, ...(extra.collider || {}) };
      // the controller's OBB frame: local x = dx*cs - dz*sn, local z = dx*sn + dz*cs  (= rotation.y by `rot`)
      if (rot) c.obb = { cx: x, cz: z, hx: w / 2, hz: d / 2, cs, sn };
      colliders.push(c);
      return m;
    };
    if (!show) {
      addBox(-22, 10, 14, 18, 14);
      addBox(24, -5, 12, 12, 22, 0x9c8f80);
      addBox(-14, -40, 10, 10, 9, 0xc0b49d, 0.5);
      addBox(18, 35, 8, 6, 3.5, 0xa0a6aa);
      addBox(0, -70, 30, 6, 4, 0x8f8f8f);
      // bridge piers in the river (below the deck)
      for (const z of [95, 125]) addBox(0, z, 12, 4, 7.4, 0x7d776b, 0, { y0: -2 });
    }
    window.__sb = { world, colliders, scene };

    // ---- lineup ----
    const labels = [];
    const label = (text, obj, y) => {
      const el = document.createElement('div');
      el.className = 'lbl';
      el.textContent = text;
      document.body.appendChild(el);
      labels.push({ el, obj, y });
    };
    let showCam = null;
    if (show) {
      const defs = [
        ['blackCab', 'Black cab', {}],
        ['rideCar', 'RideLDN car', {}],
        ['hatch', 'Hatch', { colour: 0x2f5f8f }],
        ['saloon', 'Saloon', { colour: 0xb8bcc0 }],
        ['suv', 'SUV', { colour: 0x3d4a3f }],
        ['van', 'White van', {}],
        ['doubleDecker', 'Double-decker (24)', { route: '24', destination: 'Pimlico' }],
        ['hireBike', 'Hire bike', {}],
        ['policeHeli', 'Police helicopter', {}],
        ['riverBoat', 'River bus', {}]
      ];
      const list = show === 'all' ? defs : defs.filter((d) => d[0] === show);
      const placed = [];
      let x = 0;
      const lineup = show === 'all';
      for (const [key, text, opts] of list) {
        const m = VEHICLE_FACTORIES[key](opts);
        const sp = m.userData.spec;
        if (key === 'riverBoat') {
          m.position.set(lineup ? -40 : -60, -1.2, lineup ? 95 : 110);
          m.rotation.y = Math.PI / 2;
        } else if (key === 'policeHeli') {
          m.position.set(lineup ? 24 : 0, 0, lineup ? 22 : 0);
          m.rotation.y = 0.5;
        } else {
          const w = key === 'doubleDecker' ? 3.6 : key === 'hireBike' ? 1.6 : 2.6;
          x += w / 2;
          m.position.set(x - 14, 0, 0);
          x += w / 2 + 0.6;
        }
        scene.add(m);
        placed.push(m);
        let tris = 0, draws = 0;
        m.traverse((o) => { if (o.isMesh) { draws++; tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } });
        (window.__sb.stats ||= {})[key] = { tris: Math.round(tris), draws };
        label(text, m, (sp.height || 2) + 0.6);
      }
      if (lineup) {
        const cx = 0;
        for (const m of placed) if (m.userData.kind !== 'riverBoat' && m.userData.kind !== 'policeHeli') m.position.x -= x / 2 - 14;
        const view = q.get('view') || 'front';
        showCam = view === 'rear' ? { pos: [-6, 7, -20], look: [2, 1, 6] }
          : view === 'top' ? { pos: [0, 40, 10], look: [0, 0, 5] }
          : { pos: [6, 6.5, 19], look: [-1, 1.2, 2] };
      } else {
        const sp = placed[0].userData.spec;
        const target = placed[0].position.clone().add(new THREE.Vector3(0, (sp.height || 2) * 0.45, 0));
        const yaw = THREE.MathUtils.degToRad(+(q.get('yaw') ?? (q.get('view') === 'rear' ? 215 : 35)));
        const dist = +(q.get('dist') || Math.max(4, (sp.length || 4) * 1.35));
        const el = q.get('view') === 'top' ? 1.1 : q.get('view') === 'low' ? 0.05 : 0.32;
        const r0 = placed[0].rotation.y;
        showCam = {
          pos: [target.x + Math.sin(yaw + r0) * dist * Math.cos(el), target.y + dist * Math.sin(el), target.z + Math.cos(yaw + r0) * dist * Math.cos(el)],
          look: target.toArray()
        };
      }
      if (night) VEHICLE_UNIFORMS.brake.value = 0.4;
    }

    // ---- drive ----
    let controllers = null, cams = null;
    if (mode) {
      controllers = new ThirdPersonControllerManager(scene, colliders, {
        world, mode,
        spawn: { x: 0, z: 0, heading: 0 },
        spawns: { boat: { x: -60, z: 110, heading: Math.PI / 2 }, helicopter: { x: 8, z: -25, heading: 0, y: +(q.get('alt') || 0) }, person: { x: 8, z: 0, heading: 0 } }
      });
      // pedestrians.js draws people from storage buffers, which come out as noise on the headless WebGL2 fallback:
      // hide them there unless asked for (&people)
      if (q.has('webgl') && !q.has('people')) scene.traverse((o) => { if (/^People(Near|Far)$/.test(o.name)) o.visible = false; });
      cams = new CameraSystem(renderer.domElement, controllers);
      cams.setCameraPreset(q.get('cam') || 'chase', true);
      Object.assign(window.__sb, { controllers, cams });
      if (q.has('autotest')) runAutotest(controllers);
      if (q.get('tp')) { const [x, z, h] = q.get('tp').split(',').map(Number); controllers.teleportActiveTo(x, z, h || 0); }
      if (q.get('keys')) for (const k of q.get('keys').split(',')) controllers.keys[k] = true; // e.g. &keys=forward,left
    }

    // ---- ?autotest: scripted drives in every mode, pure fixed-step simulation (no rendering needed) ----
    // Holds keys, then checks the player moved and stayed out of colliders / water (boat: stayed on water).
    // Results: console "PASS/FAIL …" lines, window.__sb.autotest = {pass, results}, document.title "AUTOTEST PASS|FAIL".
    function runAutotest(c) {
      let t = 0;
      const state = () => {
        const e = c.getActiveEntity(), m = c.activeMode;
        const pts = c.footprint(m, e.position.x, e.position.z, e.heading, 0.8);
        let inCollider = false;
        for (const k of colliders) {
          if (e.position.y + 0.5 > k.maxY + 1.5) continue;
          for (const [x, z] of pts) {
            if (x <= k.minX || x >= k.maxX || z <= k.minZ || z >= k.maxZ) continue;
            if (k.obb) {
              const o = k.obb, dx = x - o.cx, dz = z - o.cz;
              if (Math.abs(dx * o.cs - dz * o.sn) >= o.hx || Math.abs(dx * o.sn + dz * o.cs) >= o.hz) continue;
            }
            inCollider = true;
          }
        }
        const wet = pts.map(([x, z]) => c.isWater(x, z) && c.getGroundHeight(x, z, m) < 0.3);
        return { x: e.position.x, y: e.position.y, z: e.position.z, h: e.heading, speed: e.speed, inCollider,
          anyWater: wet.some(Boolean), allWater: pts.every(([x, z]) => c.isWater(x, z)) };
      };
      const dry = (a, r, moved, min) => moved < min ? 'did not move' : r.inCollider ? 'inside a collider' : r.anyWater ? 'in the water' : '';
      const hits = [];
      c.addCollisionListener((ev) => hits.push(ev));
      const S = [
        ['car', 'straight up onto the bridge', [1.8, 0, 0], ['forward'], 6, (a, r, m) => dry(a, r, m, 30) || (r.y > 3 ? '' : 'not on deck')],
        ['car', 'stops at the embankment', [30, 30, 0], ['forward'], 6, (a, r, m) => dry(a, r, m, 3) || (r.z < 60 ? '' : 'crossed')],
        ['car', 'stops at a building', [24, -40, 0], ['forward'], 5, (a, r, m) => dry(a, r, m, 3) || (r.z < -11 ? '' : 'went through')],
        ['car', 'turns left (A)', [-40, -60, 0], ['forward', 'left'], 3, (a, r, m) => dry(a, r, m, 3) || (r.h > a.h + 0.5 ? '' : 'no turn')],
        ['car', 'handbrake slide', [-60, -120, 0], ['forward'], 3, null],
        ['car', '…then handbrake + steer', null, ['up', 'right'], 1.2, (a, r, m) => dry(a, r, m, 3) || (r.h < a.h - 0.3 ? '' : 'no slide turn')],
        ['ride', 'straight up onto the bridge', [-1.8, -10, 0], ['forward'], 7, (a, r, m) => dry(a, r, m, 30) || (r.y > 3 ? '' : 'not on deck')],
        ['ride', 'stops at the embankment', [-30, 30, 0], ['forward'], 6, (a, r, m) => dry(a, r, m, 3) || (r.z < 60 ? '' : 'crossed')],
        ['cyclist', 'pedal forward', [-30, -60, 0], ['forward'], 6, (a, r, m) => dry(a, r, m, 10)],
        ['cyclist', 'stops at the embankment', [30, 45, 0], ['forward'], 8, (a, r, m) => dry(a, r, m, 2) || (r.z < 60 ? '' : 'crossed')],
        ['person', 'walk forward', [8, 0, 0], ['forward'], 4, (a, r, m) => dry(a, r, m, 8)],
        ['person', 'walk into the river', [30, 50, 0], ['forward', 'boost'], 5, (a, r, m) => dry(a, r, m, 2) || (r.z < 60 ? '' : 'swam')],
        ['helicopter', 'climb + forward', [8, -25, 0], ['forward', 'up'], 5, (a, r, m) => m > 30 && r.y > a.y + 20 ? '' : 'no climb'],
        ['boat', 'throttle east between the piers', [-60, 110, Math.PI / 2], ['forward'], 10, (a, r, m) => m > 40 && r.allWater && !r.inCollider ? '' : 'blocked/aground'],
        ['boat', 'stops at the bank', [-80, 110, 0], ['forward'], 12, (a, r, m) => m > 5 && r.allWater && r.z < 160 ? '' : 'beached'],
        ['boat', 'hits a bridge pier', [-40, 95, Math.PI / 2], ['forward'], 12, (a, r, m) => r.allWater && !r.inCollider && r.x < -5.5 ? '' : 'through the pier'],
        ['bus', 'drives forward', [60, -260, 0], ['forward'], 8, (a, r, m) => dry(a, r, m, 40) || (r.speed > 9 ? '' : 'too slow')],
        ['bus', 'stops at a building', [0, -110, 0], ['forward'], 7, (a, r, m) => dry(a, r, m, 3) || (r.z < -78 ? '' : 'went through')],
        ['bus', 'turns left (A)', [60, -300, 0], ['forward', 'left'], 5, (a, r, m) => dry(a, r, m, 10) || (r.h > a.h + 0.5 ? '' : 'no turn')],
        ['bus', 'doors open: stays put', [60, -300, 0], ['forward'], 3, (a, r, m) => m < 0.3 && c.entities.bus.doorOpen > 0.9 ? '' : 'drove off with doors open',
          () => { c.setBusDoors(true); c.setBusLivery({ route: '11', destination: 'Liverpool Street' }); }],
        ['bus', 'doors shut: pulls away', null, ['forward'], 3, (a, r, m) => m > 5 && c.entities.bus.route === '11' ? '' : 'stuck', () => c.setBusDoors(false)]
      ];
      const results = [];
      for (const [m, name, tp, keys, secs, expect, pre] of S) {
        if (c.activeMode !== m) c.setMode(m);
        if (tp) c.teleportActiveTo(tp[0], tp[1], tp[2]);
        if (pre) pre();
        const a = state();
        for (const k of keys) c.keys[k] = true;
        for (let i = 0; i < secs * 60; i++) c.update(1 / 60, (t += 1 / 60));
        c.resetInput();
        for (let i = 0; i < 20; i++) c.update(1 / 60, (t += 1 / 60));
        const r = state();
        const moved = Math.hypot(r.x - a.x, r.z - a.z);
        const why = expect ? expect(a, r, moved) : '';
        results.push({ mode: m, name, ok: !why, why, moved, to: [r.x, r.y, r.z] });
        console.log(`${why ? 'FAIL' : 'PASS'} ${m.padEnd(10)} ${name.padEnd(32)} moved ${moved.toFixed(1).padStart(6)} m → (${r.x.toFixed(1)}, ${r.y.toFixed(1)}, ${r.z.toFixed(1)}) ${why}`);
      }
      const pass = results.every((r) => r.ok) && hits.some((h) => h.kind === 'collider') && hits.some((h) => h.kind === 'embankment');
      console.log(`collision events: ${hits.length} (${[...new Set(hits.map((h) => h.mode + ':' + h.kind))].join(', ')})`);
      console.log(pass ? 'AUTOTEST PASS' : 'AUTOTEST FAIL');
      window.__sb.autotest = { pass, results, hits: hits.length };
      document.title = pass ? 'AUTOTEST PASS' : 'AUTOTEST FAIL';
      c.setMode(mode);
    }

    const camera = cams ? cams.camera : new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 3000);
    if (showCam) {
      camera.position.set(...showCam.pos);
      camera.lookAt(...showCam.look);
    }
    addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    });

    // ?drive=slalom|wall|reverse: scripted inputs (sim time), with a per-step trace for frame-by-frame checks
    let drive = null;
    if (controllers && q.get('drive')) {
      const kind = q.get('drive');
      const set = (o) => Object.assign(controllers.keys, { forward: false, backward: false, left: false, right: false, up: false, boost: false }, o);
      let t0 = null;
      window.__sb.trace = [];
      if (kind === 'wall') controllers.teleportActiveTo(-38, -10, 0.52); // 30° into the west face of the block at (-22, 10)
      if (kind === 'reverse') controllers.teleportActiveTo(-11.6, 10, Math.PI / 2); // tail against the block at (-22, 10): camera must pull in
      drive = (t) => {
        if (t0 === null) t0 = t;
        const s = t - t0;
        if (kind === 'slalom') set(s < 2 ? { forward: true } : { forward: true, left: Math.floor(s / 0.7) % 2 === 0, right: Math.floor(s / 0.7) % 2 === 1 });
        else if (kind === 'wall') set({ forward: true });
        else if (kind === 'reverse') set({ backward: s < 3 });
        const e = controllers.getActiveEntity(), cp = cams.camera.position;
        window.__sb.trace.push([+s.toFixed(3), +e.position.x.toFixed(3), +e.position.z.toFixed(3), +e.heading.toFixed(4), +e.speed.toFixed(3), +cp.x.toFixed(3), +cp.y.toFixed(3), +cp.z.toFixed(3)]);
      };
    }

    // fixed-step simulation (stable even at SwiftShader frame rates)
    const STEP = 1 / 60;
    let acc = 0, simTime = 0, last = performance.now(), frames = 0;
    window.__sb.frames = 0;
    window.__sb.simTime = 0;
    const v = new THREE.Vector3();
    renderer.setAnimationLoop(() => {
      const now = performance.now();
      acc += Math.min(1, (now - last) / 1000);
      last = now;
      let n = 0;
      while (acc >= STEP && n < 90) {
        if (controllers && drive) drive(simTime);
        if (controllers) controllers.update(STEP, simTime);
        if (cams) cams.update(STEP, simTime);
        acc -= STEP;
        simTime += STEP;
        n++;
      }
      if (n === 90) acc = 0;
      window.__sb.simTime = simTime;
      renderer.render(scene, camera);
      window.__sb.frames = ++frames;
      for (const l of labels) {
        v.copy(l.obj.position).y += l.y;
        v.project(camera);
        const vis = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
        l.el.style.display = vis ? 'block' : 'none';
        l.el.style.left = `${(v.x * 0.5 + 0.5) * innerWidth}px`;
        l.el.style.top = `${(-v.y * 0.5 + 0.5) * innerHeight}px`;
      }
      if (controllers) {
        const e = controllers.getActiveEntity();
        hud.textContent = `${e.label}  ${Math.round(Math.abs(e.speed) * 2.237)} mph  ` +
          `x ${e.position.x.toFixed(1)} y ${e.position.y.toFixed(2)} z ${e.position.z.toFixed(1)}  h ${(e.heading * 57.3).toFixed(0)}°`;
      } else hud.textContent = `vehicles: ${show}${night ? ' (night)' : ''}`;
    });
  </script>
</body>
</html>
