<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bus driver sandbox</title>
  <link rel="icon" href="data:," />
  <!--
    tests/sandbox-bus.html — Workstream B (round 2): the bus-driver job on a slice of the real map.
      ?route=25&dir=0     route & direction to preload (default 25 / 0); &stops=N truncates the route (tests)
      ?webgl              WebGL2 backend (headless)          ?offline   force the mock backend (default here)
      ?autotest           scripted shift: pick route → drive (autopilot) → stop, doors, boarding/alighting at each stop →
                          summary saved in the offline mock; logs PASS/FAIL, sets document.title "AUTOTEST PASS|FAIL"
      ?speed=N            simulation time scale (default 1; autotest uses 6)
    Keys: WASD drive · J route picker · F doors · P autopilot. window.__bus exposes { bd, controllers, bus, autopilot, … }.
    Shows a radius of the real map around the route: road ribbons, pavements and extruded buildings (no city renderer).
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "../vendor/three/build/three.webgpu.js",
        "three/webgpu": "../vendor/three/build/three.webgpu.js",
        "three/tsl": "../vendor/three/build/three.tsl.js",
        "three/addons/": "../vendor/three/examples/jsm/"
      }
    }
  </script>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    html, body { background: #8fa3b8; }
    #sb-info { position: fixed; right: 20px; bottom: 20px; z-index: 10; padding: 9px 12px; border-radius: 12px; font-size: 12px; line-height: 1.5;
      background: rgba(16,17,20,.72); border: 1px solid rgba(255,255,255,.09); color: rgba(246,245,242,.8); font-variant-numeric: tabular-nums;
      font-family: var(--font-sans, Inter, system-ui, sans-serif); }
    #sb-info b { color: #fff; }
    #sb-speed { position: fixed; right: 20px; bottom: 76px; z-index: 10; padding: 8px 14px; border-radius: 14px; background: rgba(16,17,20,.72);
      border: 1px solid rgba(255,255,255,.09); color: #fff; font: 800 26px/1 var(--font-sans, Inter, system-ui, sans-serif); font-variant-numeric: tabular-nums; }
    #sb-speed small { font-size: 11px; font-weight: 650; color: rgba(246,245,242,.6); margin-left: 4px; }
  </style>
</head>
<body>
  <main id="canvas-container"></main>
  <div id="sb-speed">0<small>mph</small></div>
  <div id="sb-info">Bus sandbox · <b>WASD</b> drive · <b>J</b> routes · <b>F</b> doors · <b>P</b> autopilot<br /><span id="sb-stats"></span></div>
  <script type="module">
    import * as THREE from 'three/webgpu';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { GEO } from '../js/ldn-geodata.js';
    import { createWorldQueries } from '../js/london-world.js';
    import { VEHICLE_FACTORIES } from '../js/london-vehicles.js';
    import { createBackend } from '../js/backend.js';
    import { BusDriver, loadBusRoutes, PathTrack } from '../js/bus-driver.js';

    const qs = new URLSearchParams(location.search);
    const AUTOTEST = qs.has('autotest');
    const ROUTE = qs.get('route') || '25';
    const DIR = Number(qs.get('dir') || 0);
    const MAXSTOPS = Number(qs.get('stops') || (AUTOTEST ? 5 : 0));
    const world = createWorldQueries(GEO);
    const data = await loadBusRoutes();
    const route = data.routes.find((r) => r.ref === ROUTE) || data.routes[0];
    const variant = route.variants[DIR] || route.variants[0];

    // ---------- region: the (truncated) route + 160 m ----------
    const track = new PathTrack(variant.path);
    const sEnd = MAXSTOPS ? variant.stops[Math.min(variant.stops.length, MAXSTOPS) - 1].s + 120 : track.length;
    const regionPts = track.points(0, sEnd);
    const R = 170;
    const nearRoute = (x, z, r = R) => {
      for (let i = 0; i < regionPts.length; i += 1) if (Math.abs(regionPts[i].x - x) < r && Math.abs(regionPts[i].z - z) < r) return true;
      return false;
    };
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    for (const p of regionPts) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z); }

    // ---------- renderer & scene ----------
    const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: qs.has('webgl') });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = !qs.has('noshadow');
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    await renderer.init();
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa9b8c8);
    scene.fog = new THREE.Fog(0xa9b8c8, 180, 900);
    scene.add(new THREE.HemisphereLight(0xe4ecf6, 0x4a4436, 1.5));
    const sun = new THREE.DirectionalLight(0xfff0d8, 2.4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 400 });
    sun.shadow.bias = -0.0005;
    scene.add(sun, sun.target);
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.3, 3000);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), new THREE.MeshStandardMaterial({ color: 0x6d6f66, roughness: 1 }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.set((minX + maxX) / 2, -0.02, (minZ + maxZ) / 2);
    ground.receiveShadow = true;
    scene.add(ground);

    // roads: flat ribbons (pavement band under the carriageway)
    const DRIVE = new Set(['motorway', 'trunk', 'primary', 'secondary', 'tertiary', 'unclassified', 'residential', 'living_street', 'service']);
    const WALKK = new Set(['pedestrian', 'footway']);
    function ribbons(filter, widthFn, y) {
      const pos = [];
      for (const r of GEO.roads) {
        if (!filter(r)) continue;
        const p = r.pts;
        let any = false;
        for (let i = 0; i < p.length; i += 2) if (nearRoute(p[i], p[i + 1])) { any = true; break; }
        if (!any) continue;
        const hw = widthFn(r) / 2;
        for (let i = 0; i + 3 < p.length; i += 2) {
          const ax = p[i], az = p[i + 1], bx = p[i + 2], bz = p[i + 3];
          let dx = bx - ax, dz = bz - az; const L = Math.hypot(dx, dz) || 1; dx /= L; dz /= L;
          const nx = -dz * hw, nz = dx * hw, ex = dx * hw * 0.9, ez = dz * hw * 0.9;
          const a0 = [ax - ex + nx, y, az - ez + nz], a1 = [ax - ex - nx, y, az - ez - nz], b0 = [bx + ex + nx, y, bz + ez + nz], b1 = [bx + ex - nx, y, bz + ez - nz];
          pos.push(...a0, ...b0, ...a1, ...a1, ...b0, ...b1);
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.computeVertexNormals();
      return g;
    }
    const roadW = (r) => Math.max(5, r.w || 7);
    const pave = new THREE.Mesh(ribbons((r) => DRIVE.has(r.kind) && r.kind !== 'service', (r) => roadW(r) + 6.5, 0.05),
      new THREE.MeshStandardMaterial({ color: 0x9c988f, roughness: 0.92, side: THREE.DoubleSide }));
    const walk = new THREE.Mesh(ribbons((r) => WALKK.has(r.kind), (r) => Math.max(3, r.w || 3), 0.045),
      new THREE.MeshStandardMaterial({ color: 0xa8a39a, roughness: 0.92, side: THREE.DoubleSide }));
    const road = new THREE.Mesh(ribbons((r) => DRIVE.has(r.kind), roadW, 0.08),
      new THREE.MeshStandardMaterial({ color: 0x34363b, roughness: 0.9, side: THREE.DoubleSide }));
    for (const m of [pave, walk, road]) { m.receiveShadow = true; scene.add(m); }
    // centre lines on two-way roads (dashed white) — a quick touch of road paint
    {
      const pos = [];
      for (const r of GEO.roads) {
        if (!DRIVE.has(r.kind) || r.oneway || r.kind === 'service' || (r.w || 0) < 6.5) continue;
        const p = r.pts;
        if (!nearRoute(p[0], p[1], R + 200)) continue;
        for (let i = 0; i + 3 < p.length; i += 2) {
          const ax = p[i], az = p[i + 1], bx = p[i + 2], bz = p[i + 3];
          let dx = bx - ax, dz = bz - az; const L = Math.hypot(dx, dz); if (L < 1) continue; dx /= L; dz /= L;
          for (let s = 1; s + 3 < L; s += 9) {
            const x0 = ax + dx * s, z0 = az + dz * s, x1 = ax + dx * (s + 3), z1 = az + dz * (s + 3), nx = -dz * 0.07, nz = dx * 0.07;
            pos.push(x0 + nx, 0.09, z0 + nz, x1 + nx, 0.09, z1 + nz, x0 - nx, 0.09, z0 - nz, x0 - nx, 0.09, z0 - nz, x1 + nx, 0.09, z1 + nz, x1 - nx, 0.09, z1 - nz);
          }
        }
      }
      const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
      scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xe8e6df, roughness: 0.6, side: THREE.DoubleSide })));
    }
    // buildings near the route (extruded footprints, a few materials)
    {
      const B = GEO.buildings, groups = [[], [], [], [], []];
      const pal = [0x9a6a4a, 0xc9bda2, 0x7d4a36, 0xe0d9c8, 0x7a7d80];
      for (let b = 0; b < B.count; b++) {
        const s = B.ringStart[b], e = B.ringStart[b + 1];
        if (e - s < 3) continue;
        const x0 = B.xz[2 * s], z0 = B.xz[2 * s + 1];
        if (x0 < minX - 120 || x0 > maxX + 120 || z0 < minZ - 120 || z0 > maxZ + 120 || !nearRoute(x0, z0, 95)) continue;
        const shape = new THREE.Shape();
        for (let p = s; p < e; p++) (p === s ? shape.moveTo : shape.lineTo).call(shape, B.xz[2 * p], -B.xz[2 * p + 1]);
        const hgt = Math.max(4, Math.min(60, B.height[b] || 12)) - (B.minHeight[b] || 0);
        const g = new THREE.ExtrudeGeometry(shape, { depth: hgt, bevelEnabled: false });
        g.rotateX(-Math.PI / 2);
        g.translate(0, B.minHeight[b] || 0, 0);
        groups[B.material[b] % groups.length].push(g.toNonIndexed ? g : g);
      }
      groups.forEach((list, i) => {
        if (!list.length) return;
        const geo = mergeGeometries(list.map((g) => { const n = g.index ? g.toNonIndexed() : g; n.deleteAttribute('uv'); return n; }));
        const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: pal[i], roughness: 0.88 }));
        m.castShadow = m.receiveShadow = true;
        scene.add(m);
      });
    }

    // ---------- the bus (stand-in controller with the real double-decker model) ----------
    let busModel = VEHICLE_FACTORIES.doubleDecker({ route: route.ref, destination: variant.destination });
    busModel.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(busModel);
    const p0 = track.pointAt(Math.max(0, variant.stops[0].s - 40), {});
    const bus = { position: new THREE.Vector3(p0.x, 0, p0.z), heading: p0.h, speed: 0, model: busModel, mesh: busModel, label: 'Double-decker',
      halfExtents: { hx: 1.26, hz: 5.6 }, doorsOpen: false };
    const listeners = new Set();
    const controllers = {
      activeMode: 'bus',
      entities: { bus },
      getActiveEntity() { return bus; },
      setMode(m) { this.activeMode = m; },
      teleportActiveTo(x, z, h = bus.heading) { bus.position.set(x, 0, z); bus.heading = h; bus.speed = 0; return { x, z }; },
      setBusLivery({ route: r, destination }) {
        scene.remove(busModel);
        busModel = VEHICLE_FACTORIES.doubleDecker({ route: r, destination });
        busModel.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
        bus.model = bus.mesh = busModel;
        scene.add(busModel);
      },
      setBusDoors(open) { bus.doorsOpen = open; },
      addCollisionListener(fn) { listeners.add(fn); return () => listeners.delete(fn); },
      _emitCollision(impulse) { for (const fn of listeners) fn({ impulse, mode: 'bus' }); }
    };
    const keys = {};
    addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'KeyP') autopilot.on = !autopilot.on; });
    addEventListener('keyup', (e) => { keys[e.code] = false; });

    // ---------- backend + bus driver ----------
    const backend = createBackend({ offline: true });
    const bd = new BusDriver({ scene, camera, controllers, world, geo: GEO, backend, ui: { renderer, routes: data, setMode: (m) => controllers.setMode(m) } });

    // autopilot: pure pursuit along the route, brakes to a stop at the bay centre, waits while the doors are open
    const autopilot = { on: AUTOTEST, vmax: 11.5 };
    function stepBus(dt) {
      const sh = bd.shift;
      let target = 0;
      if (autopilot.on && sh && bd.phase === 'driving') {
        const route = bd.getRoute();
        let acc = 0, aim = route[route.length - 1];
        for (let i = 1; i < route.length; i++) { acc += Math.hypot(route[i].x - route[i - 1].x, route[i].z - route[i - 1].z); if (acc > 9) { aim = route[i]; break; } }
        if (aim) {
          const want = Math.atan2(aim.x - bus.position.x, aim.z - bus.position.z);
          const da = Math.atan2(Math.sin(want - bus.heading), Math.cos(want - bus.heading));
          bus.heading += clamp(da, -1.1 * dt, 1.1 * dt) * Math.min(1, Math.abs(bus.speed) / 2 + 0.2);
          const toBay = bd._bayCentre(sh.k) - sh.s;
          const stopHere = sh.waiting[sh.k].length > 0 || sh.requested || sh.k === sh.stops.length - 1 || sh.k === 0;
          target = Math.min(autopilot.vmax, Math.abs(da) > 0.45 ? 5 : autopilot.vmax);
          if (stopHere) target = toBay < 0.3 ? 0 : Math.min(target, Math.sqrt(2 * 1.4 * Math.max(0, toBay - 0.3)) + 0.2);
          if (stopHere && toBay < 0.4) target = 0;
        }
        bus.speed += clamp(target - bus.speed, -2.2 * dt, 1.6 * dt);
        if (target === 0 && bus.speed < 0.25) bus.speed = 0;
      } else if (autopilot.on) {
        bus.speed = Math.max(0, bus.speed - 3 * dt);
      } else {
        const th = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
        const st = (keys.KeyA || keys.ArrowLeft ? 1 : 0) - (keys.KeyD || keys.ArrowRight ? 1 : 0);
        if (th > 0) bus.speed = Math.min(13, bus.speed + 2.2 * dt);
        else if (th < 0) bus.speed = bus.speed > 0.2 ? Math.max(0, bus.speed - 6 * dt) : Math.max(-3, bus.speed - 1.5 * dt);
        else bus.speed *= Math.max(0, 1 - dt * 0.35);
        if (Math.abs(bus.speed) > 0.2) bus.heading += st * 0.75 * Math.min(1, Math.abs(bus.speed) / 6) * Math.sign(bus.speed) * dt;
      }
      bus.position.x += Math.sin(bus.heading) * bus.speed * dt;
      bus.position.z += Math.cos(bus.heading) * bus.speed * dt;
      busModel.position.copy(bus.position);
      busModel.rotation.y = bus.heading;
    }
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    window.__bus = { bd, controllers, bus, autopilot, backend, scene, camera, renderer, data, route, variant, timeScale: Number(qs.get('speed') || (AUTOTEST ? 6 : 1)), camOverride: null, simTime: 0, frames: 0 };

    // ---------- loop (fixed 30 Hz simulation, up to 90 steps per rendered frame) ----------
    const statsEl = document.getElementById('sb-stats'), speedEl = document.getElementById('sb-speed');
    let last = performance.now(), acc = 0;
    const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
    let camInit = 0;
    renderer.setAnimationLoop((now) => {
      const real = Math.min(0.25, (now - last) / 1000);
      last = now;
      acc += real * window.__bus.timeScale;
      let n = 0;
      while (acc >= 1 / 30 && n < 90) { stepBus(1 / 30); bd.update(1 / 30); window.__bus.simTime += 1 / 30; acc -= 1 / 30; n++; }
      if (n === 90) acc = 0;
      const co = window.__bus.camOverride;
      if (co) { camInit = 0; camera.position.set(...co.pos); camera.lookAt(...co.look); }
      else {
        const back = 19, up = 7.5, fx = Math.sin(bus.heading), fz = Math.cos(bus.heading);
        camPos.set(bus.position.x - fx * back + fz * 2, up, bus.position.z - fz * back - fx * 2);
        camera.position.lerp(camPos, camInit++ < 2 ? 1 : 0.12);
        camLook.set(bus.position.x + fx * 8, 2.2, bus.position.z + fz * 8);
        camera.lookAt(camLook);
      }
      sun.position.set(bus.position.x - 60, 120, bus.position.z + 40);
      sun.target.position.copy(bus.position);
      if (!window.__bus.paused) renderer.render(scene, camera);
      window.__bus.frames++;
      speedEl.firstChild.textContent = String(Math.round(Math.abs(bus.speed) * 2.237));
      const st = bd.getState();
      statsEl.textContent = `${bd.phase}${st.ref ? ` · route ${st.ref} · stop ${st.k + 1}/${st.stops} · aboard ${st.aboard}` : ''} · autopilot ${autopilot.on ? 'on' : 'off'}`;
    });
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

    // ---------- autotest ----------
    const results = [];
    const check = (ok, msg) => { results.push(ok); console.log(`${ok ? 'PASS' : 'FAIL'} ${msg}`); };
    const waitFor = async (fn, simSeconds = 120) => {
      const t0 = window.__bus.simTime;
      while (!fn()) { if (window.__bus.simTime - t0 > simSeconds) return false; await new Promise((r) => setTimeout(r, 50)); }
      return true;
    };
    window.__bus.waitFor = waitFor;
    window.__bus.ready = true;
    if (AUTOTEST) {
      (async () => {
        try {
          await backend.init({ askName: false });
          check(!!backend.player, 'joined the offline mock');
          bd.openPicker();
          check(!!document.querySelector('.bd-picker') && document.querySelectorAll('.bd-item').length === data.routes.length, `picker lists ${data.routes.length} routes`);
          bd.sel = { ref: route.ref, dir: DIR };
          bd._renderPicker();
          window.__bus.stage = 'picker';
          await waitFor(() => window.__bus.go || !qs.has('stagewait'), 1e9);
          check(bd.startShift(route.ref, DIR, { maxStops: MAXSTOPS }), `started route ${route.ref} → ${variant.destination} (${MAXSTOPS || variant.stops.length} stops)`);
          check(!document.querySelector('.bd-scrim') || document.querySelector('.bd-scrim').style.display === 'none', 'picker closed');
          const total = bd.shift.stops.length;
          let boardedSeen = false, alightSeen = false;
          for (let k = 0; k < total; k++) {
            const name = bd.shift.stops[k].name;
            const okStop = await waitFor(() => !bd.shift || bd.shift.k > k || (bd._bayInfo?.inBay && Math.abs(bus.speed) < 0.3), 400);
            if (!bd.shift || bd.shift.k > k) { console.log(`  (stop ${k} ${name} passed — nobody waiting)`); continue; }
            check(okStop, `stopped in the bay at ${name}`);
            const pre = { aboard: bd.shift.aboard.length, waiting: bd.shift.waiting[k].length, off: bd.shift.aboard.filter((p) => p.dest === k || k === total - 1).length };
            bd.toggleDoors();
            check(bd.phase === 'dwell' && bus.doorsOpen, `doors open at ${name} (${pre.waiting} waiting, ${pre.off} getting off)`);
            if (pre.waiting && pre.off && !window.__bus.shotBoarding) {
              window.__bus.stage = 'boarding';
              await waitFor(() => bd.shift.dwell && (bd.shift.dwell.boardedN >= 1 || bd.shift.dwell.alightedN >= 1), 30);
              await waitFor(() => window.__bus.go2 || !qs.has('stagewait'), 1e9);
              window.__bus.shotBoarding = true;
            }
            const done = await waitFor(() => bd.shift.dwell && bd.shift.dwell.doneNoted, 120);
            check(done, `boarding & alighting finished (${bd.shift.dwell?.boardedN} on, ${bd.shift.dwell?.alightedN} off)`);
            if (!done) console.log('  debug', JSON.stringify({ bus: [bus.position.x, bus.position.z, bus.heading], dw: bd.shift.dwell && bd.shift.dwell.board.map((p) => [p.state, p.x, p.z, p.delay, p.inDoor]),
              people: bd.people.map((p) => [p.id, p.state]), door: bd._doorPoint('front', 0.55) }));
            if (bd.shift.dwell.boardedN) boardedSeen = true;
            if (bd.shift.dwell.alightedN) alightSeen = true;
            if (k === total - 1) break; // the last stop closes its own doors and ends the shift
            // hold if early (timetable), then close the doors and pull away
            const early = bd.shift.sched[k] - bd.shift.t - 60;
            if (early > 0) await waitFor(() => bd.shift.sched[k] - bd.shift.t - 60 <= 0, early + 5);
            bd.toggleDoors();
            check(!bus.doorsOpen && bd.shift.k === k + 1, `doors closed, heading to stop ${k + 2}`);
          }
          check(boardedSeen, 'passengers boarded');
          check(alightSeen, 'passengers got off');
          const fin = await waitFor(() => bd.phase === 'done', 60);
          check(fin, 'shift finished → summary');
          const r = bd.lastResult || {};
          check(!!r.saved && r.saved.pay > 0, `summary saved in the mock: pay ${r.saved?.pay}, ${r.passengers} passengers, on time ${r.on_time_pct}%, comfort ${r.comfort}%`);
          const db = JSON.parse(localStorage.getItem('londonloop_mock_db') || '{}');
          check((db.busShifts || []).some((s) => s.player_id === backend.player.id && s.route === route.ref.toUpperCase()), 'shift row in londonloop_mock_db.busShifts');
          check(!!document.querySelector('.bd-sum .bd-amt') && (r.leaderboard || []).length > 0, 'summary card with leaderboard shown');
          window.__bus.stage = 'summary';
        } catch (e) {
          console.error(e);
          check(false, `exception ${e.message}`);
        }
        const ok = results.length && results.every(Boolean);
        console.log(`AUTOTEST ${ok ? 'PASS' : 'FAIL'} (${results.filter(Boolean).length}/${results.length})`);
        document.title = `AUTOTEST ${ok ? 'PASS' : 'FAIL'}`;
        window.__bus.autotest = ok ? 'PASS' : 'FAIL';
      })();
    } else {
      backend.init({ askName: !qs.has('autoname') }).then(() => bd.openPicker());
    }
  </script>
</body>
</html>
