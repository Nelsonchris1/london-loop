<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map &amp; weather sandbox · London Loop</title>
  <link rel="icon" href="data:," />
  <!--
    Workstream E sandbox.
      ?            radar minimap + HUD plates over a blank page, fake player driving the Strand with a GPS route
      ?view=full   the full "London Street Atlas" (&zoom=<css px per m>&cx=&cz= to frame it, &search=<street>)
      ?route=ext   an external (RideLDN-style) route + pickup / drop-off pins instead of the GPS waypoint
      ?weather=clear|overcast|drizzle|fog  [&time=golden|midday|twilight|midnight]  3D weather scene (lighting.js)
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "../vendor/three/build/three.webgpu.js",
        "three/webgpu": "../vendor/three/build/three.webgpu.js",
        "three/tsl": "../vendor/three/build/three.tsl.js",
        "three/addons/": "../vendor/three/examples/jsm/"
      }
    }
  </script>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body { background: #3a4048; }
    body.weather { background: #000; }
    #sb-info { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 30; padding: 7px 12px; border-radius: 10px; font-size: 12px;
      background: rgba(16,17,20,.72); color: rgba(246,245,242,.85); font-variant-numeric: tabular-nums; white-space: nowrap; }
    #canvas-container { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <svg class="icon-sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-golden" viewBox="0 0 24 24"><path d="M3 17.5h18M7 17.5a5 5 0 0 1 10 0M12 5v3M5.6 9.6l2 1.6M18.4 9.6l-2 1.6M7.5 21h9"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5 7 7M17 17l1.5 1.5M5.5 18.5 7 17M17 7l1.5-1.5"/></symbol>
      <symbol id="i-twilight" viewBox="0 0 24 24"><path d="M3 15.5h18M7.5 19h9M8 15.5a4 4 0 0 1 8 0M17.5 4v3.2M15.9 5.6h3.2M7 7.4v1.8M6.1 8.3h1.8"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5.5 12h13"/></symbol>
      <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.4"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><path d="M12 2.5v3.1M12 18.4v3.1M2.5 12h3.1M18.4 12h3.1"/></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m20 20-4.6-4.6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4.5 3.5 6.6v13l5.5-2.1 6 2.1 5.5-2.1v-13L15 6.6 9 4.5zM9 4.5v13M15 6.6v13"/></symbol>
    </defs>
  </svg>
  <div id="sb-info">loading…</div>
  <main id="canvas-container"></main>

  <!-- same HUD markup as index.html (the parts this workstream styles) -->
  <header class="hud hud-top-left">
    <div class="panel brand">
      <span class="mta-bullet" aria-hidden="true">NY</span>
      <div class="brand-titles">
        <div class="brand-heading"><h1>Slop New York</h1></div>
        <div class="brand-subtitle">three.js · WebGPU · TSL · <span id="hud-fps" class="fps-ok">60</span> fps</div>
      </div>
    </div>
  </header>
  <div class="hud hud-top-right">
    <div id="hud-toolbar" class="panel toolbar">
      <div class="time-switch" role="group" aria-label="Atmosphere &amp; time of day">
        <button class="time-btn active" data-time="golden" type="button" title="Golden Hour"><svg class="icon" aria-hidden="true"><use href="#i-golden"/></svg><span class="seg-label">Golden Hour</span></button>
        <button class="time-btn" data-time="midday" type="button" title="Sunny Midday"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg><span class="seg-label">Midday</span></button>
        <button class="time-btn" data-time="twilight" type="button" title="Blue Hour"><svg class="icon" aria-hidden="true"><use href="#i-twilight"/></svg><span class="seg-label">Blue Hour</span></button>
        <button class="time-btn" data-time="midnight" type="button" title="Night 23:00"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg><span class="seg-label">Night</span></button>
      </div>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button id="btn-open-map" class="tool-btn" type="button" title="Full map [M]"><svg class="icon" aria-hidden="true"><use href="#i-map"/></svg><span class="tool-label">Map</span><kbd>M</kbd></button>
    </div>
  </div>
  <div class="hud hud-bottom-left">
    <div id="hud-location" class="location" aria-live="off"></div>
    <aside id="minimap-card" class="panel radar" aria-label="Radar minimap">
      <canvas id="minimap-canvas"></canvas>
      <span class="radar-north" aria-hidden="true">N</span>
      <kbd class="radar-key">M</kbd>
    </aside>
  </div>

  <section id="fullmap-modal" class="fullmap-modal hidden" role="dialog" aria-modal="true" aria-label="Full street map">
    <div id="fullmap-canvas-wrap" class="fullmap-canvas-wrap"><canvas id="fullmap-canvas"></canvas></div>
    <div class="fullmap-header">
      <div class="panel fullmap-title">
        <span class="mta-bullet" aria-hidden="true">NY</span>
        <div><h2>Manhattan Street Atlas</h2><p id="fullmap-player-info" class="fullmap-subtitle">You are at …</p></div>
      </div>
      <label class="panel fullmap-search-wrap">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="fullmap-search" class="fullmap-search" type="text" placeholder="Search" aria-label="Search street or landmark" autocomplete="off" spellcheck="false" />
      </label>
      <button id="close-fullmap-btn" class="panel tool-btn fullmap-close" type="button" title="Close map [M / Esc]"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg><span class="tool-label">Close</span><kbd>Esc</kbd></button>
    </div>
    <div class="map-controls">
      <div class="panel map-compass" title="True north">
        <svg viewBox="0 0 44 44" aria-hidden="true"><g id="map-compass-needle"><path d="M22 9.5 25.6 22h-7.2z" fill="#f05a4f"/><path d="M22 34.5 25.6 22h-7.2z" fill="rgba(255,255,255,0.72)"/><text x="22" y="8" text-anchor="middle">N</text></g></svg>
      </div>
      <div class="panel map-zoom">
        <button id="map-zoom-in" class="icon-btn" type="button" aria-label="Zoom in"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <button id="map-zoom-out" class="icon-btn" type="button" aria-label="Zoom out"><svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
      </div>
      <div class="panel map-zoom">
        <button id="map-center-player" class="icon-btn" type="button" aria-label="Center on player"><svg class="icon" aria-hidden="true"><use href="#i-locate"/></svg></button>
        <button id="map-view-all" class="icon-btn" type="button" aria-label="Fit all"><svg class="icon" aria-hidden="true"><use href="#i-fit"/></svg></button>
      </div>
    </div>
    <div class="fullmap-footer"><div class="panel fullmap-status"><span id="fullmap-hover-info">Click anywhere to teleport &amp; set your GPS route · Drag to pan · Scroll to zoom</span></div></div>
    <div class="panel fullmap-legend"><span id="fullmap-counts" class="legend-counts"></span></div>
  </section>

  <script type="module">
    const qs = new URLSearchParams(location.search);
    const info = document.getElementById('sb-info');
    const fail = (e) => { info.textContent = 'ERROR ' + (e && e.message || e); console.error(e); };
    window.addEventListener('error', (e) => fail(e.error || e.message));

    if (qs.has('weather')) {
      runWeather().catch(fail);
    } else {
      runMap().catch(fail);
    }


    // ---------------------------------------------------------------------------------------------------------------
    // Weather sandbox: a London-ish street of boxes on a wet-able road, lit by lighting.js, graded by post-processing.js
    // ---------------------------------------------------------------------------------------------------------------
    async function runWeather() {
      document.body.classList.add('weather');
      document.querySelector('.hud-bottom-left').style.display = 'none';
      const THREE = await import('three/webgpu');
      const { pass, mix, float, vec3, color, positionWorld, sin, fract, floor, hash, smoothstep } = await import('three/tsl');
      const { LightingSystem, weatherUniforms } = await import('../js/lighting.js');
      const { createPostProcessing } = await import('../js/post-processing.js');
      const { applyLondonHud } = await import('../js/london-ui.js');

      const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: qs.has('webgl') });
      renderer.setPixelRatio(1);
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      document.getElementById('canvas-container').appendChild(renderer.domElement);
      await renderer.init();

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.3, 6000);
      camera.position.set(-3, 2.2, 70);
      camera.lookAt(2, 6, -60);
      const lighting = new LightingSystem(scene, renderer);
      if (qs.has('raindebug')) { const m = lighting.rain.mesh.material; m.opacityNode = float(1); m.colorNode = vec3(1, 0, 0); m.transparent = false; m.needsUpdate = true; }

      // road: dark asphalt that darkens & turns glossy with weatherUniforms.wetness (what Workstream F's roads do)
      const w = weatherUniforms.wetness;
      const road = new THREE.MeshStandardNodeMaterial();
      const puddle = smoothstep(0.55, 0.75, sin(positionWorld.x.mul(0.31)).mul(sin(positionWorld.z.mul(0.23))).add(0.5).mul(w));
      road.colorNode = mix(color(0x4a4a4c), color(0x1e1f22), w.mul(0.7));
      road.roughnessNode = mix(float(0.92), float(0.28), w).sub(puddle.mul(0.25));
      road.metalnessNode = float(0.0);
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600).rotateX(-Math.PI / 2), road);
      ground.receiveShadow = true;
      scene.add(ground);
      const pave = new THREE.MeshStandardNodeMaterial({ color: 0x9a968e, roughness: 0.85 });
      for (const x of [-9.5, 9.5]) {
        const kerb = new THREE.Mesh(new THREE.BoxGeometry(5, 0.15, 400), pave);
        kerb.position.set(x, 0.075, -60);
        kerb.receiveShadow = true;
        scene.add(kerb);
      }
      // terraces: London stock brick, red brick, white stucco, Portland stone
      const mats = [0xb39a7a, 0x9c5a44, 0xe9e4d8, 0xd8d0bc, 0x7d6a58].map((c) => new THREE.MeshStandardNodeMaterial({ color: c, roughness: 0.9 }));
      let seed = 7;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      for (const side of [-1, 1]) {
        for (let z = 90; z > -260;) {
          const len = 8 + rnd() * 14, h = 9 + rnd() * 16 + (rnd() < 0.12 ? 30 : 0);
          const b = new THREE.Mesh(new THREE.BoxGeometry(14, h, len - 0.4), mats[Math.floor(rnd() * mats.length)]);
          b.position.set(side * 19, h / 2, z - len / 2);
          b.castShadow = b.receiveShadow = true;
          scene.add(b);
          z -= len;
        }
      }
      // a red double-decker-sized box, a black cab-sized box, lamp posts with sodium heads
      const bus = new THREE.Mesh(new THREE.BoxGeometry(2.55, 4.4, 11), new THREE.MeshStandardNodeMaterial({ color: 0xc8102e, roughness: 0.4 }));
      bus.position.set(-3.2, 2.2, 30); bus.castShadow = true; scene.add(bus);
      const cab = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.8, 4.6), new THREE.MeshStandardNodeMaterial({ color: 0x111214, roughness: 0.25 }));
      cab.position.set(3, 0.9, 45); cab.castShadow = true; scene.add(cab);
      const postM = new THREE.MeshStandardNodeMaterial({ color: 0x1b1c1e, roughness: 0.6 });
      const headM = new THREE.MeshBasicNodeMaterial({ color: new THREE.Color(0xffb15a).multiplyScalar(6) });
      for (let z = 80; z > -250; z -= 28) {
        for (const x of [-8.2, 8.2]) {
          const post = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 7, 8), postM);
          post.position.set(x, 3.5, z); post.castShadow = true; scene.add(post);
          const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.18, 0.5), headM);
          head.position.set(x * 0.92, 7, z); scene.add(head);
        }
      }

      const scenePass = pass(scene, camera);
      const grade = createPostProcessing(renderer, scenePass.getTextureNode('output'), null);
      const pipeline = new THREE.RenderPipeline(renderer, grade.outputNode);

      const time = qs.get('time') || 'golden';
      const weather = qs.get('weather') || 'clear';
      const selectTime = (id) => {
        lighting.applyPreset(id);
        grade.applyPreset(lighting.activePresetId);
        document.querySelectorAll('[data-time]').forEach((b) => b.classList.toggle('active', b.dataset.time === id));
      };
      document.querySelectorAll('[data-time]').forEach((b) => b.addEventListener('click', () => selectTime(b.dataset.time)));
      applyLondonHud({ mainHooks: { lighting, colorGrade: grade, initialWeather: weather } });
      selectTime(time);
      addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

      let t0 = performance.now(), frames = 0;
      renderer.setAnimationLoop(() => {
        const t = (performance.now() - t0) / 1000;
        if (!qs.has('still')) { camera.position.z = 70 - (t % 40) * 1.5; camera.lookAt(2, 6, camera.position.z - 130); }
        lighting.update(camera.position);
        pipeline.render();
        frames++;
        if (qs.has('frames') && frames >= Number(qs.get('frames'))) { renderer.setAnimationLoop(null); info.textContent += ' · stopped'; }
        if (frames % 10 === 0 || frames < 5) info.textContent = `weather sandbox · ${lighting.activePresetId} · ${lighting.weather} · wetness ${weatherUniforms.wetness.value.toFixed(2)} · rain ${weatherUniforms.rain.value.toFixed(2)} · ${(frames / t).toFixed(1)} fps`;
      });
    }

    async function runMap() {
      const t0 = performance.now();
      const { GEO } = await import('../js/ldn-geodata.js');
      const { WORLD, getLocationLabel, LONDON_LANDMARKS, TELEPORT_LOCATIONS } = await import('../js/london-config.js');
      const { LondonMapSystem } = await import('../js/london-map.js');
      const { applyLondonHud, renderLocationPlates } = await import('../js/london-ui.js');
      const tLoad = performance.now() - t0;

      // fake player: drive along a named road
      const roadName = qs.get('road') || 'Strand';
      const segs = GEO.roads.filter((r) => r.name === roadName && r.kind !== 'footway');
      // chain the longest stretch: start from the longest way, append ways that continue it
      let path = [];
      if (segs.length) {
        const byLen = segs.map((r) => ({ r, n: r.pts.length })).sort((a, b) => b.n - a.n);
        path = Array.from(byLen[0].r.pts);
        const used = new Set([byLen[0].r]);
        for (let grow = true; grow;) {
          grow = false;
          for (const { r } of byLen) {
            if (used.has(r)) continue;
            const p = r.pts, ex = path[path.length - 2], ez = path[path.length - 1];
            if (Math.hypot(p[0] - ex, p[1] - ez) < 1) { path.push(...Array.from(p).slice(2)); used.add(r); grow = true; }
          }
        }
      }
      const cum = [0];
      for (let i = 2; i < path.length; i += 2) cum.push(cum[cum.length - 1] + Math.hypot(path[i] - path[i - 2], path[i + 1] - path[i - 1]));
      const total = cum[cum.length - 1] || 1;
      const ent = { position: { x: 0, y: 0, z: 0 }, heading: 0, speed: 12 };
      const cam = { currentPos: { x: 0, y: 0, z: 0 }, currentLookAt: { x: 0, y: 0, z: 0 } };
      let dist = Number(qs.get('t') || 0) * 12;
      function place() {
        const d = ((dist % total) + total) % total;
        let i = 1;
        while (i < cum.length - 1 && cum[i] < d) i++;
        const f = (d - cum[i - 1]) / Math.max(1e-6, cum[i] - cum[i - 1]);
        const ax = path[2 * (i - 1)], az = path[2 * (i - 1) + 1], bx = path[2 * i], bz = path[2 * i + 1];
        ent.position.x = ax + (bx - ax) * f;
        ent.position.z = az + (bz - az) * f;
        ent.heading = Math.atan2(bx - ax, bz - az);
        cam.currentPos.x = ent.position.x - Math.sin(ent.heading) * 8;
        cam.currentPos.z = ent.position.z - Math.cos(ent.heading) * 8;
        cam.currentLookAt.x = ent.position.x;
        cam.currentLookAt.z = ent.position.z;
      }
      place();

      const fakeCars = { cars: Array.from({ length: 200 }, (_, i) => { const p = WORLD.randomRoadPoint(() => ((i * 9301 + 49297) % 233280) / 233280 * 0.98 + 0.01, { kinds: 'drive' }); return { x: p ? p.x : 0, z: p ? p.z : 0 }; }) };
      const mapSystem = new LondonMapSystem({
        controllerManager: { getActiveEntity: () => ent },
        cameraSystem: cam,
        trafficSystem: fakeCars,
        onTeleport: (x, z, heading) => { console.log('[sandbox] teleport', x.toFixed(1), z.toFixed(1), heading); },
        onToggle: (open) => console.log('[sandbox] map', open)
      });
      window.mapSystem = mapSystem;
      const hud = applyLondonHud({ mainHooks: { onWeather: (w) => console.log('[sandbox] weather', w) } });

      if (qs.get('route') === 'ext') {
        const { RoadGraph } = await import('../js/rideldn.js');
        const g = new RoadGraph(GEO.roads);
        const pick = TELEPORT_LOCATIONS.coventGarden, drop = TELEPORT_LOCATIONS.stPauls;
        const r1 = g.route(ent.position.x, ent.position.z, pick.x, pick.z);
        mapSystem.setRoute(r1.pts, { color: '#14b88f' });
        mapSystem.setPins([{ x: pick.x, z: pick.z, kind: 'pickup', label: 'Pick up · Amira' }, { x: drop.x, z: drop.z, kind: 'dropoff', label: "Drop off · St Paul's" }]);
      } else {
        const tb = LONDON_LANDMARKS.find((l) => l.id === (qs.get('to') || 'towerBridge'));
        mapSystem.setWaypoint(tb.x, tb.z, tb.name);
      }

      if (qs.get('view') === 'full') {
        mapSystem.toggleFullMap(true);
        if (qs.has('zoom')) mapSystem.viewZoom = Number(qs.get('zoom'));
        if (qs.has('cx')) mapSystem.viewCenterX = Number(qs.get('cx'));
        if (qs.has('cz')) mapSystem.viewCenterZ = Number(qs.get('cz'));
        if (qs.get('fit')) mapSystem.fitWorld();
        if (qs.has('search')) { const el = document.getElementById('fullmap-search'); el.value = qs.get('search'); mapSystem.search(el.value); }
      }
      document.getElementById('btn-open-map').addEventListener('click', () => mapSystem.toggleFullMap(true));

      let last = performance.now(), frames = 0, acc = 0, worst = 0, locT = 0;
      const moving = !qs.has('still');
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        if (moving) { dist += ent.speed * dt; place(); }
        const a = performance.now();
        mapSystem.update();
        const ms = performance.now() - a;
        worst = Math.max(worst, ms);
        acc += ms; frames++;
        if (now - locT > 250) {
          locT = now;
          renderLocationPlates(document.getElementById('hud-location'), getLocationLabel(ent.position.x, ent.position.z));
          info.textContent = `load ${tLoad.toFixed(0)} ms · map.update avg ${(acc / frames).toFixed(2)} ms, worst ${worst.toFixed(1)} ms · tiles ${mapSystem.tiles.size} (queue ${mapSystem.tileQueue.size}) · ${roadName} ${(dist % total).toFixed(0)}/${total.toFixed(0)} m`;
          acc = 0; frames = 0; worst = 0;
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
