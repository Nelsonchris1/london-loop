<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>London Loop · life & audio sandbox</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fa3b5; font: 12px/1.35 system-ui, Arial, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; left: 10px; top: 8px; color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "../vendor/three/build/three.webgpu.js",
        "three/webgpu": "../vendor/three/build/three.webgpu.js",
        "three/tsl": "../vendor/three/build/three.tsl.js",
        "three/addons/": "../vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">loading…</div>
  <script type="module">
    // tests/sandbox-life.html — Workstream L sandbox: Thames boats + wakes, aircraft & helicopters, pigeons, traffic,
    // and the audio engine, on a small piece of the real map.
    //   ?scene=river (default; Westminster Bridge) | pigeons (Trafalgar Sq) | sky (looking up from the Embankment) | street
    //   ?cx=&cz=&r=  area   ?cam=x,y,z  ?at=x,y,z  camera position / target   ?city (draw F's city around, r ≤ 250)
    //   ?gather      move every boat into view   ?scatter=s  walk a stand-in player into the flock after s seconds
    //   ?warm=s      simulate s seconds before the first frame   ?frames=N  stop after N frames   ?night ?rain ?webgl
    //   ?focus=clipper|tourist|barge|rib|bus|cab  chase that boat / the nearest such vehicle (&off=side,up,back)
    //   ?traffic     add the road traffic (vehicles / people) around the centre
    //   ?audiotest   run the audio graph for real (needs --autoplay-policy=no-user-gesture-required) and log levels
    import * as THREE from 'three/webgpu';
    import { GEO, WORLD, LONDON_LANDMARKS } from '../js/london-config.js';
    import { setVehicleNightFromGlow, VEHICLE_UNIFORMS } from '../js/london-vehicles.js';
    import { createLondonLife } from '../js/life/london-life.js';
    import { createLondonAudio } from '../js/audio/london-audio.js';
    import { toWorld } from '../js/geo-frame.js';

    const q = new URLSearchParams(location.search);
    const scene_ = q.get('scene') || 'river';
    const night = q.has('night');
    const hud = document.getElementById('hud');
    const PRESETS = {
      river: { c: [430, 690], r: 420, cam: [560, 34, 470], at: [400, 0, 760] },
      pigeons: { c: [0, -33], r: 140, cam: [26, 9, 2], at: [0, 0, -36] },
      sky: { c: [430, 400], r: 300, cam: [430, 2, 400], at: [-600, 700, 300] },
      street: { c: [0, 60], r: 220, cam: [40, 30, 140], at: [0, 0, 40] }
    };
    const P = PRESETS[scene_] || PRESETS.river;
    const num3 = (s, d) => (s ? s.split(',').map(Number) : d);
    const [cx, cz] = [+(q.get('cx') ?? P.c[0]), +(q.get('cz') ?? P.c[1])];
    const R = +(q.get('r') ?? P.r);
    const camPos = num3(q.get('cam'), P.cam), camAt = num3(q.get('at'), P.at);

    const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: q.has('webgl') });
    renderer.setPixelRatio(1);
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = !q.has('noshadow');
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);
    await renderer.init();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(night ? 0x0b1020 : 0x9fb4c8);
    scene.fog = new THREE.Fog(scene.background, 1500, 9000);
    scene.add(new THREE.HemisphereLight(night ? 0x334466 : 0xdfe8f2, 0x4a4a40, night ? 0.35 : 1.4));
    const sun = new THREE.DirectionalLight(0xfff1dd, night ? 0.05 : 2.2);
    sun.position.set(cx - 200, 300, cz + 150);
    sun.target.position.set(cx, 0, cz);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -R * 0.6, right: R * 0.6, top: R * 0.6, bottom: -R * 0.6, near: 10, far: 1200 });
    scene.add(sun, sun.target);
    setVehicleNightFromGlow(night ? 1.5 : 0.3);

    // ground, the river, flat roads (or F's city)
    let city = null;
    if (q.has('city')) {
      const { buildLondonCity } = await import('../js/london-city.js');
      city = buildLondonCity(scene, { geo: GEO, world: WORLD, region: { cx, cz, r: Math.min(R, 250) }, trees: false });
    } else {
      const ground = new THREE.Mesh(new THREE.CircleGeometry(R * 1.4, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardNodeMaterial({ color: 0x6a6f66, roughness: 1 }));
      ground.position.set(cx, -1.6, cz); // below the water (the sandbox has no embankments)
      ground.receiveShadow = true;
      scene.add(ground);
      const DRIVE = new Set(['trunk', 'primary', 'secondary', 'tertiary', 'unclassified', 'residential']);
      const pos = [];
      for (const r of GEO.roads) {
        if (!DRIVE.has(r.kind) && r.kind !== 'pedestrian') continue;
        const p = r.pts, w = (r.kind === 'pedestrian' ? 6 : r.w) / 2;
        for (let i = 0; i + 3 < p.length; i += 2) {
          const ax = p[i], az = p[i + 1], bx = p[i + 2], bz = p[i + 3];
          if (Math.hypot(ax - cx, az - cz) > R * 1.2) continue;
          const L = Math.hypot(bx - ax, bz - az) || 1, nx = ((az - bz) / L) * w, nz = ((bx - ax) / L) * w;
          const ya = (r.deck ? r.deck[i / 2] : 0) + 0.01, yb = (r.deck ? r.deck[i / 2 + 1] : 0) + 0.01;
          pos.push(ax + nx, ya, az + nz, bx + nx, yb, bz + nz, ax - nx, ya, az - nz, ax - nx, ya, az - nz, bx + nx, yb, bz + nz, bx - nx, yb, bz - nz);
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.computeVertexNormals();
      const roads = new THREE.Mesh(g, new THREE.MeshStandardNodeMaterial({ color: 0x3a3c40, roughness: 0.9, side: THREE.DoubleSide }));
      roads.receiveShadow = true;
      scene.add(roads);
      for (const w of GEO.water.filter((w) => w.kind === 'river')) {
        const sh = new THREE.Shape();
        for (let i = 0; i < w.pts.length; i += 2) (i ? sh.lineTo : sh.moveTo).call(sh, w.pts[i], -w.pts[i + 1]);
        for (const h of w.holes || []) { const hp = new THREE.Path(); for (let i = 0; i < h.length; i += 2) (i ? hp.lineTo : hp.moveTo).call(hp, h[i], -h[i + 1]); sh.holes.push(hp); }
        const m = new THREE.Mesh(new THREE.ShapeGeometry(sh).rotateX(-Math.PI / 2), new THREE.MeshStandardNodeMaterial({ color: night ? 0x0d1820 : 0x2f4552, roughness: 0.18, metalness: 0.1 }));
        m.position.y = -1.2;
        m.receiveShadow = true;
        scene.add(m);
      }
    }

    const life = createLondonLife(scene, { world: WORLD, surfaceHeight: city ? city.surfaceHeight : null, planeInterval: q.has('planes') ? +q.get('planes') : 90 });
    let traffic = null;
    if (q.has('traffic')) {
      const { buildLondonRoadNetwork } = await import('../js/road-network.js');
      const { createTrafficSystem } = await import('../js/traffic.js');
      const network = buildLondonRoadNetwork(GEO, WORLD);
      traffic = createTrafficSystem(scene, { network, geo: GEO, world: WORLD, vehicles: +(q.get('vehicles') ?? 80), peds: +(q.get('peds') ?? 100), radius: Math.min(R, 300) });
      traffic.setRain(q.has('rain'));
    }

    const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.3, 60000);
    camera.position.set(...camPos);
    camera.lookAt(...camAt);
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

    // gather the boats in view (screenshots)
    if (q.has('gather')) {
      const nr = life.river.river.nearest(camAt[0], camAt[2]);
      life.boats.forEach((b, i) => { b.s = nr.s - 260 + i * 36; b.lat = life.river.river.laneOffset(b.s, b.dir); b.state = 'cruise'; b.pier = false; });
    }
    if (scene_ === 'sky') { life.sky.planes.length = 0; life.sky.spawnPlane(); life.sky.planes[0].x = 1400; life.sky.spawnHeli(cx, cz); const h = life.sky.helicopters[0]; h.x = cx + 500; h.z = cz - 300; h.y = 150; h.vx = -50; h.vz = 20; }

    // a stand-in player (for pigeons / boats): an entity-like object
    const player = { position: new THREE.Vector3(cx + 30, 0, cz + 30), heading: 0, speed: 0, halfExtents: { hx: 0.3, hz: 0.3 } };
    const scatterAt = q.has('scatter') ? +q.get('scatter') : Infinity;
    const playerMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 1.1, 4, 8), new THREE.MeshStandardNodeMaterial({ color: 0xc8102e }));
    if (scene_ === 'pigeons') scene.add(playerMesh);

    const audio = q.has('audiotest') ? createLondonAudio({
      controllers: { activeMode: 'person', keys: {}, getActiveEntity: () => player, addCollisionListener: () => {} },
      traffic, life, world: WORLD, geo: GEO, landmarks: LONDON_LANDMARKS, night: () => VEHICLE_UNIFORMS.night.value, button: true
    }) : null;
    let analyser = null;
    if (audio) {
      audio.setMuted(false);
      audio.unlock();
      const a = audio.core.ctx.createAnalyser();
      a.fftSize = 2048;
      audio.core.out.comp.connect(a);
      analyser = a;
      window.__audio = audio;
    }
    const rms = () => {
      if (!analyser) return 0;
      const b = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(b);
      let s = 0, pk = 0;
      for (const v of b) { s += v * v; pk = Math.max(pk, Math.abs(v)); }
      return { rms: Math.sqrt(s / b.length), peak: pk };
    };

    const warm = +(q.get('warm') ?? 6);
    let simT = 0;
    const ctxFor = (dt) => {
      simT += dt;
      if (simT > scatterAt) {
        // walk briskly at the middle of the flock
        const f = life.pigeons.flocks[0];
        const dx = f.x - player.position.x, dz = f.z - player.position.z, d = Math.hypot(dx, dz);
        if (d > 1) { player.heading = Math.atan2(dx, dz); player.speed = 1.6; player.position.x += (dx / d) * 1.6 * dt; player.position.z += (dz / d) * 1.6 * dt; }
        else player.speed = 0;
      }
      playerMesh.position.set(player.position.x, 0.85, player.position.z);
      return { camera, entity: player, mode: 'person', peds: traffic ? traffic.peds : null, night: VEHICLE_UNIFORMS.night.value };
    };
    const focus = new THREE.Vector3(cx, 0, cz);
    for (let t = 0; t < warm; t += 1 / 20) {
      if (traffic) traffic.update(1 / 20, t, focus, player, 'person', camera);
      life.update(1 / 20, ctxFor(1 / 20));
    }
    console.log('[sandbox-life] scene', scene_, 'boats', life.boats.length, 'piers', life.river.river.piers.length, 'river', life.river.river.length.toFixed(0) + ' m');

    const maxFrames = q.has('frames') ? +q.get('frames') : Infinity;
    let frames = 0, last = performance.now(), ms = 0, elapsed = warm, audioLog = 0;
    renderer.setAnimationLoop((now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now; elapsed += dt;
      const a = performance.now();
      if (traffic) traffic.update(dt, elapsed, focus, player, 'person', camera);
      life.update(dt, ctxFor(dt));
      if (q.has('focus')) {
        // chase one boat: ?focus=clipper|tourist|barge|rib  (&off=side,up,back metres)
        const b = life.boats.find((o) => o.type === q.get('focus')) || (traffic && traffic.cars.filter((o) => o.type === q.get('focus')).sort((p1, p2) => Math.hypot(p1.x - cx, p1.z - cz) - Math.hypot(p2.x - cx, p2.z - cz))[0]);
        const [so, up, bk] = num3(q.get('off'), [26, 9, 30]);
        if (b) { const fx = Math.sin(b.yaw), fz = Math.cos(b.yaw); camera.position.set(b.x - fx * bk + fz * so, up, b.z - fz * bk - fx * so); camera.lookAt(b.x, 0, b.z); }
      }
      if (audio) audio.update(dt, camera);
      ms = ms * 0.9 + (performance.now() - a) * 0.1;
      renderer.render(scene, camera);
      const info = renderer.info.render;
      const st = life.stats;
      hud.textContent = `life sandbox · ${scene_}  (${cx}, ${cz})\n` +
        `boats ${life.boats.length} (${st.boatsDrawn} drawn) · aircraft ${st.aircraft} · helis ${life.helicopters.length} · pigeons ${st.pigeonsDrawn} drawn\n` +
        `life update ${st.ms.toFixed(2)} ms · frame update ${ms.toFixed(2)} ms · draw calls ${info.drawCalls} · tris ${info.triangles}`;
      window.__life = { stats: st, ms, drawCalls: info.drawCalls, triangles: info.triangles, life };
      if (audio && elapsed - audioLog > 1) { audioLog = elapsed; console.log('[audio]', JSON.stringify({ t: +elapsed.toFixed(1), state: audio.core.ctx.state, ...rms(), levels: audio.levels })); }
      if (++frames >= maxFrames) { renderer.setAnimationLoop(null); console.log('[sandbox-life] stopped after', frames, 'frames |', hud.textContent.replace(/\n/g, ' | ')); }
    });
  </script>
</body>
</html>
