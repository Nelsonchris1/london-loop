<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>London Loop — landmark sandbox</title>
  <link rel="icon" href="data:," />
  <script type="importmap">
    {
      "imports": {
        "three": "../vendor/three/build/three.webgpu.js",
        "three/webgpu": "../vendor/three/build/three.webgpu.js",
        "three/tsl": "../vendor/three/build/three.tsl.js",
        "three/addons/": "../vendor/three/examples/jsm/"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 12px/1.4 system-ui, sans-serif; }
    #hud { position: fixed; left: 8px; top: 8px; color: #fff; background: rgba(0,0,0,.45); padding: 6px 9px; border-radius: 6px; white-space: pre; pointer-events: none; }
    #pick { position: fixed; right: 8px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; max-width: 60vw; justify-content: flex-end; }
    #pick a { color: #fff; background: rgba(0,0,0,.45); padding: 3px 7px; border-radius: 5px; text-decoration: none; }
    #pick a.on { background: #c8102e; }
  </style>
</head>
<body>
  <div id="hud">loading…</div>
  <div id="pick"></div>
  <script type="module">
    // ?lm=<id> (bigBen|westminster|londonEye|towerBridge|shard|stPauls|gherkin|buckinghamPalace|trafalgarSquare|piccadillyCircus|battersea|all)
    // ?night  ?webgl  ?az=deg ?el=deg ?d=metres ?tx/ty/tz=target offset (local) ?fov ?raise (open Tower Bridge) ?t=sec (pre-advance animations)
    import * as THREE from 'three/webgpu';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { buildLondonLandmarks, LANDMARK_ALIASES, LANDMARK_UNIFORMS as LM } from '../js/london-landmarks.js';

    const q = new URLSearchParams(location.search);
    const night = q.has('night');
    const lmId = q.get('lm') || 'bigBen';
    const id = LANDMARK_ALIASES[lmId] || lmId;
    const hud = document.getElementById('hud');

    const pick = document.getElementById('pick');
    for (const k of ['bigBen', 'londonEye', 'towerBridge', 'shard', 'stPauls', 'gherkin', 'buckinghamPalace', 'trafalgarSquare', 'piccadillyCircus', 'battersea']) {
      const a = document.createElement('a');
      const p = new URLSearchParams(location.search); p.set('lm', k); ['az', 'el', 'd', 'tx', 'ty', 'tz'].forEach((x) => p.delete(x));
      a.href = '?' + p.toString(); a.textContent = k; if ((LANDMARK_ALIASES[k] || k) === id) a.className = 'on';
      pick.appendChild(a);
    }
    {
      const a = document.createElement('a'); const p = new URLSearchParams(location.search);
      night ? p.delete('night') : p.set('night', ''); a.href = '?' + p.toString().replace('night=', 'night'); a.textContent = night ? 'day' : 'night'; pick.appendChild(a);
    }

    const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: q.has('webgl') });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = night ? 1.0 : 0.95;
    renderer.shadowMap.enabled = q.has('shadows');
    document.body.appendChild(renderer.domElement);
    await renderer.init();

    const scene = new THREE.Scene();
    // gradient sky (equirect canvas) used as background + environment
    const skyTop = night ? '#060b1a' : '#4f7fbf', skyMid = night ? '#142446' : '#9fbcd8', skyHor = night ? '#2c3550' : '#f3d3ac';
    const c = document.createElement('canvas'); c.width = 16; c.height = 256;
    const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, skyTop); gr.addColorStop(0.32, skyMid); gr.addColorStop(0.5, skyHor); gr.addColorStop(0.52, night ? '#151820' : '#8a8f8a'); gr.addColorStop(1, night ? '#0a0c10' : '#4a4e4a');
    g.fillStyle = gr; g.fillRect(0, 0, 16, 256);
    const skyTex = new THREE.CanvasTexture(c); skyTex.colorSpace = THREE.SRGBColorSpace; skyTex.mapping = THREE.EquirectangularReflectionMapping;
    scene.background = skyTex; scene.environment = skyTex;
    scene.environmentIntensity = night ? 0.25 : 0.9;
    scene.fog = new THREE.Fog(night ? 0x141c30 : 0xd9cbb5, 900, 4500);

    LM.uNight.value = night ? 1 : 0;
    LM.uSkyTop.value.set(skyTop); LM.uSkyHorizon.value.set(skyHor);
    const sun = new THREE.DirectionalLight(night ? 0x8090c0 : 0xffc890, night ? 0.25 : 3.2);
    const sunDir = night ? new THREE.Vector3(0.3, 0.8, 0.2) : new THREE.Vector3(-0.55, 0.32, 0.77);
    sunDir.normalize(); LM.uSunDir.value.copy(sunDir);
    scene.add(sun, sun.target);
    scene.add(new THREE.HemisphereLight(night ? 0x223355 : 0xbcd2ee, night ? 0x10100c : 0x6b5a48, night ? 0.25 : 1.1));

    const world = q.has('world') ? (await import('../js/london-config.js')).WORLD : null;
    const lm = buildLondonLandmarks(scene, { world, only: id === 'all' ? null : [id] });
    if (lm.towerBridge) console.log('[sandbox] towerBridge deckY', lm.towerBridge.deckY.toFixed(2), 'at hinge', lm.towerBridge.deckProfile(35.2).toFixed(2), 'world?', !!world);
    const one = Object.values(lm.landmarks)[0];
    const fr = one.frame;
    const toWorld = (lx, lz) => ({ x: fr.x + lx * Math.cos(fr.theta) + lz * Math.sin(fr.theta), z: fr.z - lx * Math.sin(fr.theta) + lz * Math.cos(fr.theta) });

    // ground + water
    const water = new THREE.Mesh(new THREE.PlaneGeometry(12000, 12000), new THREE.MeshStandardNodeMaterial({ color: night ? 0x0b1620 : 0x2d4650, roughness: 0.18, metalness: 0.3 }));
    water.rotation.x = -Math.PI / 2; water.position.set(fr.x, -1.2, fr.z); scene.add(water);
    const landMat = new THREE.MeshStandardNodeMaterial({ color: night ? 0x2a2a2a : 0x8d8c86, roughness: 0.95 });
    const LAND = {
      westminster: [[-3000, -3000, 72, 3000], [330, -3000, 3000, 3000]],
      londonEye: [[14, -3000, 3000, 3000], [-3000, -3000, -250, 3000]],
      towerBridge: [[-3000, -3000, 3000, -124], [-3000, 124, 3000, 3000]],
      battersea: [[-3000, -168, 3000, 3000], [-3000, -3000, 3000, -420]]
    }[id] || [[-3000, -3000, 3000, 3000]];
    for (const [x0, z0, x1, z1] of LAND) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, 1.2, z1 - z0), landMat);
      const w = toWorld((x0 + x1) / 2, (z0 + z1) / 2);
      m.position.set(w.x, -0.6, w.z); m.rotation.y = fr.theta; m.receiveShadow = true; scene.add(m);
    }

    if (id === 'piccadillyCircus') {
      // stand-in for the city's corner building that carries the screens
      const { SCREEN_BUILDING } = await import('../js/landmarks/piccadilly.js');
      const sh = new THREE.Shape(SCREEN_BUILDING.map(([x, z]) => new THREE.Vector2(x, -z)));
      const g = new THREE.ExtrudeGeometry(sh, { depth: 24, bevelEnabled: false }); g.rotateX(-Math.PI / 2);
      scene.add(new THREE.Mesh(g, new THREE.MeshStandardNodeMaterial({ color: 0xbdb3a2, roughness: 0.9 })));
    }

    // camera framing
    const box = new THREE.Box3().setFromObject(lm.group);
    const size = box.getSize(new THREE.Vector3()), centre = box.getCenter(new THREE.Vector3());
    const lt = toWorld(+q.get('tx') || 0, +q.get('tz') || 0);
    const target = q.has('tx') || q.has('tz') ? new THREE.Vector3(lt.x, 0, lt.z) : centre.clone();
    target.y = q.has('ty') ? +q.get('ty') : Math.min(centre.y, size.y * 0.42);
    const az = (q.has('az') ? +q.get('az') : 35) * Math.PI / 180 + fr.theta, el = (q.has('el') ? +q.get('el') : 14) * Math.PI / 180;
    const dist = q.has('d') ? +q.get('d') : Math.max(size.x, size.y * 1.3, size.z) * 1.25;
    const camera = new THREE.PerspectiveCamera(+q.get('fov') || 50, innerWidth / innerHeight, 0.5, 20000);
    camera.position.set(target.x + Math.sin(az) * Math.cos(el) * dist, target.y + Math.sin(el) * dist, target.z + Math.cos(az) * Math.cos(el) * dist);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(target); controls.update();
    sun.position.copy(target).addScaledVector(sunDir, 800); sun.target.position.copy(target);
    if (renderer.shadowMap.enabled) {
      sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
      const s = Math.max(size.x, size.z) * 0.8; Object.assign(sun.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 1, far: 2500 });
    }

    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    if (q.has('raise') && lm.towerBridge) lm.towerBridge.raise();
    if (q.has('t')) { const T = +q.get('t'); for (let s = 0; s < T; s += 0.1) lm.update(0.1); }
    let last = performance.now(), frames = 0;
    let tris = 0;
    lm.group.traverse((o) => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3 * (o.isInstancedMesh ? o.count : 1); });
    let meshes = 0; lm.group.traverse((o) => { if (o.isMesh) meshes++; });
    renderer.setAnimationLoop(() => {
      const now = performance.now(); const dt = Math.min(0.1, (now - last) / 1000); last = now;
      lm.update(dt);
      controls.update();
      renderer.render(scene, camera);
      frames++;
      if (frames % 10 === 1) {
        const info = renderer.info.render;
        hud.textContent = `${id}  ${night ? 'night' : 'day'}\nmeshes ${meshes}  tris ${Math.round(tris)}\ndraw calls (frame) ${info.drawCalls}  colliders ${lm.colliders.length}  zones ${lm.zones.length}`;
        if (frames === 11) console.log('[sandbox]', hud.textContent.replace(/\n/g, ' | '));
      }
    });
  </script>
</body>
</html>
