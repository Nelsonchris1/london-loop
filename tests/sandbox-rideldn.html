<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RideLDN sandbox</title>
  <link rel="icon" href="data:," />
  <script type="importmap">
    {
      "imports": {
        "three": "../vendor/three/build/three.webgpu.js",
        "three/webgpu": "../vendor/three/build/three.webgpu.js",
        "three/tsl": "../vendor/three/build/three.tsl.js",
        "three/addons/": "../vendor/three/examples/jsm/"
      }
    }
  </script>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    #sb-info { position: fixed; left: 20px; bottom: 20px; z-index: 10; padding: 10px 12px; border-radius: 12px; font-size: 12px; line-height: 1.5;
      background: rgba(16,17,20,.7); border: 1px solid rgba(255,255,255,.09); color: rgba(246,245,242,.8); font-variant-numeric: tabular-nums; }
    #sb-info b { color: #fff; }
    #sb-modes { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 10; display: flex; gap: 4px; padding: 4px; border-radius: 14px;
      background: rgba(16,17,20,.7); border: 1px solid rgba(255,255,255,.09); }
    #sb-modes button { height: 34px; padding: 0 12px; border-radius: 10px; font-weight: 650; font-size: 12.5px; color: rgba(246,245,242,.75); }
    #sb-modes button.active { background: #3ee6b4; color: #06221a; }
  </style>
</head>
<body>
  <main id="canvas-container"></main>
  <div id="sb-info">RideLDN sandbox · <b>WASD</b> drive · <b>R</b> app · <b>Enter</b> accept · <b>P</b> autopilot<br /><span id="sb-stats"></span></div>
  <nav id="sb-modes"><button data-mode="person" type="button">Walk</button><button data-mode="car" type="button">Black cab</button><button data-mode="ride" type="button" class="active">RideLDN</button></nav>
  <script type="module">
    import * as THREE from 'three/webgpu';
    import { createBackend } from '../js/backend.js';
    import { RideLDN } from '../js/rideldn.js';

    const qs = new URLSearchParams(location.search);
    const timeScale = Number(qs.get('speed') || 1);

    // ---------- synthetic GEO: a 9 × 9 street grid (36 roads), a few POIs & stations ----------
    const N = 9, SP = 130, H0 = -((N - 1) / 2) * SP;
    const roads = [];
    const streetNames = ['Gower St', 'Dean St', 'Frith St', 'Greek St', 'Wardour St', 'Berwick St', 'Poland St', 'Marshall St', 'Carnaby St'];
    const avenueNames = ['Old Compton St', 'Brewer St', 'Broadwick St', 'Beak St', 'Peter St', 'Romilly St', 'Meard St', 'Bateman St', 'Lexington St'];
    let rid = 1;
    for (let i = 0; i < N; i++) {
      const c = H0 + i * SP;
      for (const half of [0, 1]) {
        const ptsH = [], ptsV = [];
        const from = half ? (N - 1) / 2 : 0, to = half ? N - 1 : (N - 1) / 2;
        for (let j = Math.floor(from); j <= Math.ceil(to); j++) {
          ptsH.push(H0 + j * SP, c);
          ptsV.push(c, H0 + j * SP);
        }
        const oneH = i === 2 ? 1 : i === 6 ? -1 : 0;
        roads.push({ id: rid++, name: avenueNames[i], kind: i % 4 === 0 ? 'primary' : 'residential', w: i % 4 === 0 ? 10 : 7, lanes: 2, oneway: oneH, pts: new Float32Array(ptsH) });
        roads.push({ id: rid++, name: streetNames[i], kind: i % 4 === 0 ? 'secondary' : 'residential', w: i % 4 === 0 ? 9 : 7, lanes: 2, oneway: 0, pts: new Float32Array(ptsV) });
      }
    }
    roads.push({ id: rid++, name: 'Footpath', kind: 'footway', w: 2, oneway: 0, pts: new Float32Array([H0, H0, -H0, -H0]) });
    const pois = [
      ['pub', 'The Coach & Horses', -455, -320], ['pub', 'The Dog & Duck', 300, -250], ['cafe', 'Bar Italia', -120, 420], ['theatre', 'Palace Theatre', 450, 380],
      ['museum', 'Museum of Curiosities', -400, 300], ['restaurant', 'Pellicci Caff', 140, -470], ['attraction', 'Soho Square', 0, 0], ['pub', 'The French House', -260, 60],
      ['market', 'Berwick Street Market', 260, 120], ['cinema', 'The Prince Charles Cinema', -60, -200]
    ].map(([kind, name, x, z]) => ({ kind, name, x, z }));
    const stations = [{ name: 'Tottenham Court Road', x: -520, z: -520, kind: 'tube' }, { name: 'Leicester Square', x: 520, z: 520, kind: 'tube' }, { name: 'Oxford Circus', x: -520, z: 500, kind: 'tube' }];
    const GEO = { roads, pois, stations, districts: [{ name: 'Soho', x: 60, z: -60 }] };

    // ---------- fake world queries (same API as js/london-world.js) ----------
    function nearestRoad(x, z, { kinds } = {}) {
      let best = null;
      for (const r of roads) {
        if (kinds && !kinds.includes(r.kind)) continue;
        const p = r.pts;
        for (let i = 0; i + 3 < p.length; i += 2) {
          const ax = p[i], az = p[i + 1], bx = p[i + 2], bz = p[i + 3];
          const dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz;
          const t = Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / L2));
          const px = ax + dx * t, pz = az + dz * t, d = Math.hypot(px - x, pz - z);
          if (!best || d < best.dist) best = { road: r, x: px, z: pz, dist: d, heading: Math.atan2(dx, dz) };
        }
      }
      return best;
    }
    const world = {
      groundHeight: () => 0,
      isWater: () => false,
      nearestRoad,
      streetName: (x, z) => { const r = nearestRoad(x, z); return r ? r.road.name : ''; },
      districtAt: () => 'Soho',
      randomRoadPoint: (rng = Math.random) => { const r = roads[Math.floor(rng() * 36)]; const i = 2 * Math.floor(rng() * (r.pts.length / 2)); return { x: r.pts[i], z: r.pts[i + 1], road: r }; }
    };

    // ?real: the real London GEO + world queries (roads drawn as lines, no city) to check offers & routes on real data
    const REAL = qs.has('real') ? await import('../js/london-config.js') : null;
    const useGeo = REAL ? REAL.GEO : GEO;
    const useWorld = REAL ? REAL.WORLD : world;

    // ---------- renderer & scene ----------
    const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: qs.has('webgl') });
    renderer.setPixelRatio(1);
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    await renderer.init();
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8fa3b8);
    scene.fog = new THREE.Fog(0x8fa3b8, 250, 1400);
    scene.add(new THREE.HemisphereLight(0xdfe8f5, 0x3a3428, 1.6));
    const sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
    sun.position.set(-200, 300, 150);
    scene.add(sun);
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 5000);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ color: 0x59604f, roughness: 1 }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x2c2e33, roughness: 0.95 });
    const paveMat = new THREE.MeshStandardMaterial({ color: 0x8d8a83, roughness: 0.9 });
    if (REAL) {
      const v = [];
      const drive = new Set(['trunk', 'primary', 'secondary', 'tertiary', 'unclassified', 'residential', 'living_street', 'service']);
      for (const r of REAL.GEO.roads) {
        if (!drive.has(r.kind)) continue;
        const p = r.pts;
        for (let i = 0; i + 3 < p.length; i += 2) v.push(p[i], 0.2, p[i + 1], p[i + 2], 0.2, p[i + 3]);
      }
      const lg = new THREE.BufferGeometry();
      lg.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
      scene.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0xd8d4cc })));
    }
    for (const r of REAL ? [] : roads) {
      if (r.kind === 'footway') continue;
      const p = r.pts;
      for (let i = 0; i + 3 < p.length; i += 2) {
        const ax = p[i], az = p[i + 1], bx = p[i + 2], bz = p[i + 3];
        const L = Math.hypot(bx - ax, bz - az);
        const pave = new THREE.Mesh(new THREE.BoxGeometry(r.w + 6, 0.08, L + r.w + 6), paveMat);
        pave.position.set((ax + bx) / 2, 0.03, (az + bz) / 2);
        pave.rotation.y = Math.atan2(bx - ax, bz - az);
        const m = new THREE.Mesh(new THREE.BoxGeometry(r.w, 0.06, L + r.w), roadMat);
        m.position.set((ax + bx) / 2, 0.07, (az + bz) / 2);
        m.rotation.y = pave.rotation.y;
        scene.add(pave, m);
      }
    }
    // blocks of London-stock-brick-ish buildings
    const bMats = [0x9a6a4a, 0xb9a27c, 0x7d4a36, 0xd8d0c0, 0x6e6a66].map((c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85 }));
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    if (!REAL) for (let i = 0; i < N - 1; i++) for (let j = 0; j < N - 1; j++) {
      const cx = H0 + (i + 0.5) * SP, cz = H0 + (j + 0.5) * SP;
      for (let k = 0; k < 4; k++) {
        const w = 40 + rnd() * 20, d = 40 + rnd() * 20, hgt = 10 + rnd() * 26;
        const b = new THREE.Mesh(new THREE.BoxGeometry(w, hgt, d), bMats[Math.floor(rnd() * bMats.length)]);
        b.position.set(cx + (k % 2 ? 1 : -1) * 27, hgt / 2, cz + (k > 1 ? 1 : -1) * 27);
        scene.add(b);
      }
    }

    // ---------- stand-in car + controller manager ----------
    const carGroup = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.75, 4.5), new THREE.MeshStandardMaterial({ color: 0x14161a, roughness: 0.35, metalness: 0.6 }));
    body.position.y = 0.6;
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.6, 2.4), new THREE.MeshStandardMaterial({ color: 0x1d2a33, roughness: 0.1, metalness: 0.8 }));
    cabin.position.set(0, 1.25, -0.2);
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.12, 4.55), new THREE.MeshBasicMaterial({ color: 0x3ee6b4 }));
    stripe.position.y = 0.72;
    const sign = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.18, 0.25), new THREE.MeshBasicMaterial({ color: 0x3ee6b4 }));
    sign.position.set(0, 1.64, -0.2);
    carGroup.add(body, cabin, stripe, sign);
    scene.add(carGroup);

    const start = REAL ? REAL.TELEPORT_LOCATIONS.trafalgarSquare : { x: H0 + SP * 4, z: H0 + SP * 4 + 40, heading: Math.PI };
    const car = { position: new THREE.Vector3(start.x, 0, start.z), heading: start.heading ?? Math.PI, speed: 0, mesh: carGroup, label: 'RideLDN car' };
    const keys = {};
    const listeners = new Set();
    const controllers = {
      activeMode: 'ride',
      entities: { ride: car, car, person: car },
      getActiveEntity() { return car; },
      setMode(m) { this.activeMode = m; document.querySelectorAll('#sb-modes button').forEach((b) => b.classList.toggle('active', b.dataset.mode === m)); },
      teleportActiveTo(x, z, h = car.heading) { car.position.set(x, 0, z); car.heading = h; car.speed = 0; return { x, z }; },
      addCollisionListener(fn) { listeners.add(fn); return () => listeners.delete(fn); },
      _emitCollision(impulse) { for (const fn of listeners) fn({ impulse, mode: 'ride' }); }
    };
    addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'KeyP') autopilot.on = !autopilot.on; });
    addEventListener('keyup', (e) => { keys[e.code] = false; });
    document.querySelectorAll('#sb-modes button').forEach((b) => b.addEventListener('click', () => controllers.setMode(b.dataset.mode)));

    const autopilot = { on: false, speed: 13 };
    function stepCar(dt) {
      let throttle = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
      let steer = (keys.KeyA ? 1 : 0) - (keys.KeyD ? 1 : 0);
      if (autopilot.on) {
        const route = rideldn.getRoute();
        if (route.length >= 2) {
          // pure pursuit: aim at the point ~10 m ahead on the route
          let acc = 0, aim = route[route.length - 1];
          for (let i = 1; i < route.length; i++) {
            acc += Math.hypot(route[i].x - route[i - 1].x, route[i].z - route[i - 1].z);
            if (acc > 10) { aim = route[i]; break; }
          }
          const want = Math.atan2(aim.x - car.position.x, aim.z - car.position.z);
          let da = want - car.heading;
          da = Math.atan2(Math.sin(da), Math.cos(da));
          car.heading += Math.max(-2.2 * dt, Math.min(2.2 * dt, da));
          let L = 0;
          for (let i = 1; i < route.length; i++) L += Math.hypot(route[i].x - route[i - 1].x, route[i].z - route[i - 1].z);
          const target = L < 4 ? 0 : Math.min(autopilot.speed, Math.max(2, L * 0.6), Math.abs(da) > 0.5 ? 6 : autopilot.speed);
          car.speed += Math.max(-8 * dt, Math.min(6 * dt, target - car.speed));
          if (L < 4 && car.speed < 0.3) car.speed = 0;
        } else {
          car.speed = Math.max(0, car.speed - 8 * dt);
        }
      } else {
        if (throttle) car.speed = Math.max(-8, Math.min(keys.ShiftLeft ? 30 : 20, car.speed + throttle * 12 * dt));
        else car.speed *= Math.max(0, 1 - dt * 2.5);
        if (Math.abs(car.speed) > 0.2) car.heading += steer * 1.4 * Math.min(1, Math.abs(car.speed) / 8) * Math.sign(car.speed) * dt;
      }
      car.position.x += Math.sin(car.heading) * car.speed * dt;
      car.position.z += Math.cos(car.heading) * car.speed * dt;
      carGroup.position.copy(car.position);
      carGroup.rotation.y = car.heading;
    }

    // ---------- backend + RideLDN ----------
    const backend = createBackend();
    window.sandbox = { backend, car, controllers, autopilot, world: useWorld, GEO: useGeo, scene, camera, ready: false, timeScale };
    const initP = backend.init({ askName: !qs.has('autoname') });
    const rideldn = new RideLDN({ scene, camera, controllers, world: useWorld, geo: useGeo, backend, ui: { setMode: (m) => controllers.setMode(m) } });
    window.sandbox.rideldn = rideldn;
    initP.then(() => { window.sandbox.ready = true; rideldn._render(); });
    backend.startAutosave(() => ({ v: 1, pos: { x: car.position.x, z: car.position.z, h: car.heading }, mode: controllers.activeMode, time: 'golden', weather: 'overcast' }));
    window.sandbox.teleport = (x, z, h) => { controllers.teleportActiveTo(x, z, h); carGroup.position.copy(car.position); };
    window.sandbox.camOverride = null; // {pos:[x,y,z], look:[x,y,z]}

    // ---------- loop ----------
    const statsEl = document.getElementById('sb-stats');
    let last = performance.now(), acc = 0, frames = 0;
    const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
    renderer.setAnimationLoop((now) => {
      const real = Math.min(0.25, (now - last) / 1000);
      last = now;
      acc += real * window.sandbox.timeScale;
      let n = 0;
      while (acc >= 1 / 30 && n < 30) {
        stepCar(1 / 30);
        rideldn.update(1 / 30);
        acc -= 1 / 30;
        n++;
      }
      if (n === 30) acc = 0;
      const co = window.sandbox.camOverride;
      if (co) {
        frames = 0; // snap back to the chase view when the override ends
        camera.position.set(...co.pos);
        camera.lookAt(...co.look);
      } else {
        const back = 11, up = 4.6;
        camPos.set(car.position.x - Math.sin(car.heading) * back, up, car.position.z - Math.cos(car.heading) * back);
        camera.position.lerp(camPos, frames++ < 2 ? 1 : 0.15);
        camLook.set(car.position.x + Math.sin(car.heading) * 6, 1.4, car.position.z + Math.cos(car.heading) * 6);
        camera.lookAt(camLook);
      }
      renderer.render(scene, camera);
      statsEl.textContent = `${Math.round(Math.abs(car.speed) * 2.237)} mph · ${rideldn.phase} · route ${rideldn.getRoute().length} pts · autopilot ${autopilot.on ? 'on' : 'off'}`;
    });
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  </script>
</body>
</html>
